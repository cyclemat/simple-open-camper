; Simply Open Camper – Display-Tests fuer das Waveshare ESP32-S3-Touch-LCD-7B
;
; Hier probieren wir Fixes gegen Flackern/Bildfehler aus, die im Netz auftauchen (Takt, PSRAM, Bounce-Buffer ...),
; ohne die normale Firmware anzufassen. Eigenes PlatformIO-Projekt mit eigenem Paketordner: Die Tests aendern
; custom_sdkconfig, und im gemeinsamen Paketordner wuerde dann jeder Wechsel normal <-> Test das Arduino-Framework
; neu bauen (~1 h). Der Quellcode ist derselbe (../src).
;
; Bauen/Hochladen: im PlatformIO-Menue des Panels "waveshare-7b-display-testing"
;                  oder im Hauptordner: pio run -d display-testing -t upload
; Erster Build: Pakete entpacken + Framework bauen, rechne mit 1–2 Stunden.
;
; Die Grundeinstellungen sind eine Kopie von [env:waveshare-7b] aus ../platformio.ini (Module wie dort unter
; [features], [truma], [alde] – Standardwerte). Wer dort etwas Grundsaetzliches aendert, hier nachziehen.
;
; ------------------------------------------------------------------------------------------------
; Testprotokoll (bitte fortschreiben: Datum, Einstellung, Ergebnis)
;   2026-11-11  Test 1: PSRAM + Flash 120 MHz (GitHub-Issue vom 26.09.2026), Pixeltakt 30 MHz wie gehabt
;               1. Versuch blieb bei 80 MHz (80M-Auswahl nicht abgeschaltet) – korrigiert, neu gebaut
;               2. Versuch: sdkconfig zeigt 120 MHz (PSRAM + Flash), aufgespielt 2026-11-11
;               ERGEBNIS: startet nicht – Bootloader haengt, Watchdog-Neustart (RTCWDT_RTC_RST) in Schleife.
;               Vermutlich schafft der Flash 120 MHz nicht. Naechster Versuch: Flash 80, nur PSRAM 120 (falls
;               ESP-IDF das zulaesst), sonst mehr Bounce-Zeilen / anderer Pixeltakt.
; ------------------------------------------------------------------------------------------------

[platformio]
src_dir = ../src
include_dir = ../include
packages_dir = .pio/packages
default_envs = waveshare-7b-display-testing

; ---- Stellschrauben fuer die Tests (werden zu -D-Schaltern, siehe src/app_config.h) ----
[display_test]
; Pixeltakt in MHz (normal 30; bei Drift 21 oder 18 probieren)
pclk_mhz = 30
; Bounce-Buffer in Zeilen (normal 10; 0 = aus). Mehr Zeilen = ruhigeres Bild, kostet internen RAM (je Zeile 4 KB)
bounce_lines = 10
; LVGL-Zeichenpuffer in Zeilen (normal 20)
lvgl_buf_lines = 20

[env:waveshare-7b-display-testing]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = ../partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 4194304

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_src_filter = +<*> -<sat/>
extra_scripts =
    pre:../tools/embed_web.py
    post:../tools/upload_wait.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DDISPLAY_TESTING=1
    -DLCD_PCLK_HZ=${display_test.pclk_mhz}000000
    -DLCD_BOUNCE_LINES=${display_test.bounce_lines}
    -DLVGL_BUF_LINES=${display_test.lvgl_buf_lines}
    -DPANEL_LANG=de
    -DWITH_WLED=1
    -DWITH_CERBO=1
    -DWITH_SATELLITES=1
    -DWITH_HYMER=1
    -DWITH_TRUMA_CPPLUS=0
    -DWITH_TRUMA_INETX=1
    -DTRUMA_LIN_UART=2
    -DTRUMA_LIN_RX=15
    -DTRUMA_LIN_TX=16
    -DTRUMA_LIN_EN=-1
    -DWITH_ALDE=0
    -DALDE_MODEL=3030
    -DALDE_BAUD=19200
    -DALDE_CHECKSUM=0
    -DALDE_LIN_UART=2
    -DALDE_LIN_RX=-1
    -DALDE_LIN_TX=-1
    -DALDE_LIN_EN=-1
    -DALDE_RED_UART=1
    -DALDE_RED_RX=-1

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@^2.3.0

; Wie im Haupt-Projekt, dazu die Test-Einstellungen am Ende
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_FREERTOS_HZ=1000
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024
    CONFIG_HTTPD_MAX_URI_LEN=512
    CONFIG_MQTT_BUFFER_SIZE=4096
    CONFIG_LWIP_IP_FORWARD=y
    CONFIG_LWIP_IPV4_NAPT=y
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=49152
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=1024
    ; Test 1: PSRAM und Flash mit 120 MHz (bei ESP-IDF "experimentell"; laut Espressif bei Waerme evtl. instabil)
    ; Die bisherige Auswahl (80 MHz) muss ausdruecklich aus, sonst bleibt ESP-IDF bei 80 MHz
    CONFIG_IDF_EXPERIMENTAL_FEATURES=y
    CONFIG_SPIRAM_SPEED_120M=y
    CONFIG_SPIRAM_SPEED_80M=n
    CONFIG_SPIRAM_SPEED=120
    CONFIG_ESPTOOLPY_FLASHFREQ_120M=y
    CONFIG_ESPTOOLPY_FLASHFREQ_80M=n
    ; Oktal-PSRAM 120 MHz ist bei Temperaturwechseln (~20 Grad) instabil: Timing laufend per Temperatursensor nachstellen
    CONFIG_SPIRAM_TIMING_TUNING_POINT_VIA_TEMPERATURE_SENSOR=y

; Variante "32 Sockets" (Test, seit 2026-11-24): P4-Panel wie p4/platformio.ini, aber mit 32 statt 16 Netzwerk-Sockets
; (Webserver, Broker, Tailscale, UDP … teilen sich den Vorrat). Macht es Probleme, gehen wir wieder auf 16 zurueck.
; custom_sdkconfig -> pioarduino uebersetzt die Arduino-Bibliotheken mit ESP-IDF neu ("Hybrid Compile", ~1-2 h beim
; ersten Mal), daher EIGENER Paketordner (der gemeinsame der Satelliten/normalen Panels bleibt unberuehrt).
; Aus PowerShell bauen (nicht Git-Bash):  pio run -d p4-sock32   bzw. im Panel-Menue "crowpanel-p4-sock32".
; WICHTIG: build_flags/lib_deps von Hand mit p4/platformio.ini gleich halten.
; Funkchip-Bausteine festgelegt (tools/pin_components.py) – sonst holt der Neubau neuere Versionen und das WLAN geht nicht.

[platformio]
src_dir = ../src
include_dir = ../include
; EIGENER Paketordner: custom_sdkconfig baut das Framework darin um (der gemeinsame Ordner der Satelliten bleibt heil)
packages_dir = .pio/packages
default_envs = crowpanel-p4-sock32

; ---- Board beim ersten Start (spaeter in den Einstellungen umstellbar, ohne neues Kompilieren) ----
[p4]
; Eintraege aus src/board_p4_boards.cpp, z. B. crowpanel7-v10 | crowpanel7-v11 | crowpanel7-v12
; (Revision steht auf der Platine; V1.0 hat die Datenleitungen zum C6 in anderer Reihenfolge)
board = crowpanel7-v12

[env:crowpanel-p4-sock32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; ESP32-P4 der ersten Chip-Revision (Elecrow-Beispiele: "engineering_sample"); fuer Chip-Revision 3: esp32-p4_r3
board = esp32-p4
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; eigene Aufteilung (2 x 6 MB Programm) seit 0.2.7 – Umstieg einmal per USB/Online-Flasher, Einstellungen bleiben
board_build.partitions = ../partitions_p4.csv
board_build.filesystem = littlefs
; mehr Netzwerk-Sockets (fertige Bibliotheken: 16 fuer alles – Webserver, Broker, Tailscale, UDP …)
custom_sdkconfig =
    CONFIG_LWIP_MAX_SOCKETS=32
    CONFIG_LWIP_MAX_ACTIVE_TCP=32
    ; Internen RAM sparen (2026-11-24): Bluetooth-Host (NimBLE) legt seine Pools im PSRAM an (~25 KB intern frei),
    ; lwIP-Puffer (TCP-Fenster bis 64 KB je Verbindung!) ebenfalls ins PSRAM – die WLAN-Puffer liegen beim P4 ohnehin
    ; im C6. Geht nach diesem Neubau das WLAN nicht mehr, ist SPIRAM_TRY_ALLOCATE_WIFI_LWIP der erste Verdacht.
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=n
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    ; Host-Task wertet jedes Werbepaket aus (alle Module, Ruuvi/BTHome entschluesseln) – 4 KB waren eng
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
; gleiche Versionen wie die fertigen Bibliotheken bzw. die C6-Firmware (sonst kein WLAN)
custom_pin_components =
    espressif/esp_hosted==2.12.13
    espressif/esp_wifi_remote==1.6.4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter = +<*> -<sat/> -<vicdisp/> -<devsetup.cpp> -<p4test/> -<updater/> -<updater_link.cpp>
extra_scripts =
    pre:../tools/pin_components.py
    pre:../tools/embed_web.py
    post:../tools/upload_wait.py

; Sprache der Panel-Oberflaeche (de | en | es | fr) – Varianten unten setzen nur diese Option anders
custom_lang = de
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_P4=1
    -DP4_DEFAULT_BOARD='"${p4.board}"'
    -DPANEL_LANG=${this.custom_lang}
    -DWITH_WLED=1
    -DWITH_CERBO=1
    -DWITH_BMS=1
    ; Bluetooth-Schluesselrechnung (P-256) in Software statt mit dem ECC-Rechenwerk des Chips – das rechnet beim P4 v1.x
    ; falsch (Kopplung mit Secure Connections scheitert, "DHKey Check Failed"). Ersatz: src/third_party/uecc_p256.c
    -Wl,--wrap=ble_sm_alg_gen_key_pair
    -Wl,--wrap=ble_sm_alg_gen_dhkey
    -DWITH_SATELLITES=1
    ; eingebauter MQTT-Broker (ab Werk aus, Einstellungen > MQTT) – genug RAM/PSRAM nur beim P4
    -DWITH_BROKER=1
    ; Zigbee-Funkmodul ESP32-H2 im Steckplatz (UART GPIO 27/28) – src/zb_direct.*, Firmware des Moduls: h2/
    -DWITH_ZB_DIRECT=1
    ; Regel-Engine "Wenn … dann …" mit grafischem Editor (Blockly, Reiter "Regeln") – src/rules.*, web/blockly/
    -DWITH_RULES=1
    ; Tailscale (Beta): Panel im Tailnet, Editor von unterwegs – src/tailscale.*, src/third_party/microlink (MIT)
    ; Shelly Gen2+ per Bluetooth (Beta, ab Werk aus) – src/shelly_ble.*
    -DWITH_SHELLY_BLE=1
    ; Geraete aus MQTT-Discovery (ESPHome, Tasmota …) wie Satelliten – src/mqtt_disco.*, ab Werk aus
    -DWITH_MQTT_DISCO=1
    ; Home Assistant ueber die Integration simple-open-camper-HA-Integration (WebSocket /api/ha), ab Werk aus
    -DWITH_HA_LINK=1
    ; Ton/Musik ueber den Lautsprecher-Anschluss (MP3 von der SD-Karte, Hinweistoene), ab Werk aus
    -DWITH_AUDIO=1
    -DWITH_TAILSCALE=1
    -DWITH_HYMER=1
    -DWITH_TRUMA_CPPLUS=0
    -DWITH_TRUMA_INETX=1
    -DTRUMA_LIN_UART=2
    -DTRUMA_LIN_RX=-1
    -DTRUMA_LIN_TX=-1
    -DTRUMA_LIN_EN=-1
    -DWITH_ALDE=0
    -DALDE_MODEL=3030
    -DALDE_BAUD=19200
    -DALDE_CHECKSUM=0
    -DALDE_LIN_UART=2
    -DALDE_LIN_RX=-1
    -DALDE_LIN_TX=-1
    -DALDE_LIN_EN=-1
    -DALDE_RED_UART=1
    -DALDE_RED_RX=-1

; Include-Pfade von Tailscale/microlink NUR fuer unsere Quellen (build_src_flags): in build_flags wuerden sie beim
; Hybrid-Build (custom_sdkconfig) auch die ESP-IDF-Bausteine treffen – wireguard_lwip/src/crypto.h ueberdeckt dann die
; crypto.h von wpa_supplicant und BLE-Mesh (rundes Panel sock32, 2026-11-25). Gleich halten in p4/, p4-sock32/,
; crowpanel146/, crowpanel146-sock32/.
build_src_flags =
    -I../src/third_party/microlink/include
    -I../src/third_party/microlink/wireguard_lwip/src
    -I../src/third_party/microlink/wireguard_lwip/src/crypto/refc

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    ; Bluetooth ueber den C6 (esp-hosted): esp-nimble-cpp nutzt den NimBLE-Stack des Frameworks (gleiche Klassen wie
    ; NimBLE-Arduino). NimBLE-Arduino bringt einen eigenen Stack mit, der einen Controller im Chip erwartet.
    h2zero/esp-nimble-cpp@^2.6.0


; Sprachvarianten (wie in p4/platformio.ini): nur die Oberflaechensprache anders
[env:crowpanel-p4-sock32-es]
extends = env:crowpanel-p4-sock32
custom_lang = es

[env:crowpanel-p4-sock32-fr]
extends = env:crowpanel-p4-sock32
custom_lang = fr

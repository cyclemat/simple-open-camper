; Simply Open Camper – volle Panel-Firmware auf dem ELECROW CrowPanel 1.46" HMI ESP32 Rotary Display
; (Modell DHR55146D: ESP32-S3R8, 16 MB Flash, 8 MB PSRAM OPI, rund 360x360 ST77961, Touch CST816T, Drehknopf).
;
; Alles wie bei den grossen Panels (Zigbee2MQTT, WLED, Truma, Victron, Cerbo, Akkus, Power Stations, Satelliten …),
; eingerichtet wird ueber die Weboberflaeche (Editor). Am Geraet: eine Kachel pro Bildschirm (Layout-Reihenfolge),
; Drehknopf/Wischen blaettert, Antippen/Knopfdruck schaltet, langer Druck zeigt Adresse und WLAN.
; Hardware-Schicht: src/board_crowpanel146.cpp, Oberflaeche: src/ui/ui_main.cpp (Merkmale UI_ROUND, UI_KNOB, UI_WEB_SETUP in src/app_config.h).
;
; Eigenes Projekt (Quellcode ../src) ohne custom_sdkconfig: nutzt die fertigen Arduino-Bibliotheken – kein
; Framework-Neubau. Pakete teilt es sich mit satellite/ (gleiche Plattform, ebenfalls ohne custom_sdkconfig).
; Bauen/Hochladen: im PlatformIO-Menue des Panels "crowpanel-146" oder hier: pio run -d crowpanel146 -t upload

[platformio]
src_dir = ../src
include_dir = ../include
packages_dir = ../satellite/.pio/packages
default_envs = crowpanel-146

[env:crowpanel-146]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = ../partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 4194304
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_src_filter = +<*> -<sat/> -<vicdisp/> -<devsetup.cpp> -<p4test/> -<updater/> -<updater_link.cpp>
extra_scripts =
    pre:../tools/embed_web.py
    post:../tools/upload_wait.py

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-Anschluss des ESP32-S3 direkt (kein USB-UART-Chip): Log und Hochladen darueber
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DBOARD_CROWPANEL146=1
    -DPANEL_LANG=de
    -DWITH_WLED=1
    -DWITH_CERBO=1
    -DWITH_BMS=1
    -DWITH_SATELLITES=1
    -DWITH_HYMER=1
    -DWITH_TRUMA_CPPLUS=0
    -DWITH_TRUMA_INETX=1
    -DTRUMA_LIN_UART=2
    -DTRUMA_LIN_RX=-1
    -DTRUMA_LIN_TX=-1
    -DTRUMA_LIN_EN=-1
    -DWITH_ALDE=0
    -DALDE_MODEL=3030
    -DALDE_BAUD=19200
    -DALDE_CHECKSUM=0
    -DALDE_LIN_UART=2
    -DALDE_LIN_RX=-1
    -DALDE_LIN_TX=-1
    -DALDE_LIN_EN=-1
    -DALDE_RED_UART=1
    -DALDE_RED_RX=-1

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.2
    ; 1.3.0 (1.2.7 wie bei Elecrow laesst sich mit IDF 5.5 nicht uebersetzen; Startbefehle: board_crowpanel146.cpp)
    lovyan03/LovyanGFX@1.3.0

; Rundes ZUSATZDISPLAY: zeigt ausgewaehlte Kacheln des Hauptpanels (eine pro Bildschirm) und schaltet darueber –
; abgespeckt (Satelliten-Rahmen: WLAN, Anlernen per BOOT-Taste 3 s, Weboberflaeche, Kacheln per MQTT/UDP vom Hauptpanel).
; Anzeige: src/sat/sat_round.cpp, Hardware: src/board_crowpanel146.cpp. Auswahl im Editor des Hauptpanels.
[env:crowpanel-146-remote]
platform = ${env:crowpanel-146.platform}
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = ../partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_src_filter = -<*> +<sat/> -<sat/sat_display.cpp> +<devsetup.cpp> +<sat_proto.cpp> +<truma.cpp> +<mopeka.cpp>
    +<victron.cpp> +<cerbo.cpp> +<truma_inetx.cpp> +<hymer.cpp> +<hymer_tls.cpp> +<i18n/i18n.cpp> +<updater_link.cpp>
    +<board_crowpanel146.cpp> +<fonts/font_ui_16.c> +<fonts/font_ui_20.c> +<fonts/font_ui_40.c> +<fonts/font_clock_104.c>
    +<fonts/font_icons_44.c> +<lv_psram_alloc.c>
extra_scripts = post:../tools/upload_wait.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_CROWPANEL146=1
    -DPANEL_SATELLITE=1
    -DPANEL_LANG=de
    -DWITH_TRUMA_INETX=0
    -DWITH_CERBO=0
    -DWITH_HYMER=0
    -DBLE_DEVICE_NAME='"PanelSat"'
    -DSAT_REMOTE=1
    -DSAT_ROUND=1
    ; Anlernen: BOOT-Taste 3 s halten (GPIO 0, Standard) – der Drehknopf ist mit Schalten/Dimmen belegt
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.2
    lovyan03/LovyanGFX@1.3.0

; Simply Open Camper – Panel auf dem ELECROW CrowPanel Advanced 7" (ESP32-P4 + ESP32-C6, 1024x600)
;
; Eigenes PlatformIO-Projekt mit eigenem Paketordner (anderer Chip, eigenes custom_sdkconfig – im gemeinsamen
; Paketordner wuerde jeder Wechsel S3 <-> P4 das Arduino-Framework neu bauen). Der Quellcode ist derselbe (../src).
;
; Bauen/Hochladen: im PlatformIO-Menue des Panels "crowpanel-p4"
;                  oder im Hauptordner: pio run -d p4 -t upload
; Erster Build: Pakete entpacken + Framework bauen (lange; auf einem schnellen Rechner deutlich kuerzer).
; ACHTUNG: Builds mit custom_sdkconfig in einem eigenen Paketordner nicht aus der Git-Bash starten (idf_tools.py
; bricht unter MSYS ab) – aus VS Code oder PowerShell bauen.
;
; Eine Firmware fuer alle P4-Boards: Pins/Timings je Board in src/board_p4_boards.cpp (Tabelle), das aktive Board steht
; in den Einstellungen und laesst sich ohne neues Kompilieren umstellen. Alle Boards teilen sich diese Umgebung und
; dasselbe custom_sdkconfig -> das Framework wird nur einmal gebaut. (Chip-Revision 3 braucht eine eigene Umgebung.)
;
; STAND (2026-11-12): Geruest. Board-Tabelle steht (src/board_p4.h, board_p4_boards.cpp); die Hardware-Schicht
; fuer den P4 (Display MIPI-DSI, Touch, Hintergrundlicht, WLAN/Bluetooth ueber den C6) fehlt noch – der Build
; scheitert bis dahin. Pins/Timings aus den Elecrow-Beispielen (siehe board_p4_boards.cpp), am echten Board pruefen.

[platformio]
src_dir = ../src
include_dir = ../include
; gemeinsamer Paketordner mit satellite/ (kein custom_sdkconfig -> fertige Bibliotheken, kein Neuentpacken)
packages_dir = ../satellite/.pio/packages
default_envs = crowpanel-p4

; ---- Board beim ersten Start (spaeter in den Einstellungen umstellbar, ohne neues Kompilieren) ----
[p4]
; Eintraege aus src/board_p4_boards.cpp, z. B. crowpanel7-v10 | crowpanel7-v11 | crowpanel7-v12
; (Revision steht auf der Platine; V1.0 hat die Datenleitungen zum C6 in anderer Reihenfolge)
board = crowpanel7-v12

[env:crowpanel-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; ESP32-P4 der ersten Chip-Revision (Elecrow-Beispiele: "engineering_sample"); fuer Chip-Revision 3: esp32-p4_r3
board = esp32-p4
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = ../partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter = +<*> -<sat/> -<vicdisp/> -<devsetup.cpp> -<p4test/> -<updater/> -<updater_link.cpp>
extra_scripts =
    pre:../tools/embed_web.py
    post:../tools/upload_wait.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_P4=1
    -DP4_DEFAULT_BOARD='"${p4.board}"'
    -DPANEL_LANG=de
    -DWITH_WLED=1
    -DWITH_CERBO=1
    -DWITH_BMS=1
    -DWITH_SATELLITES=1
    ; eingebauter MQTT-Broker (ab Werk aus, Einstellungen > MQTT) – genug RAM/PSRAM nur beim P4
    -DWITH_BROKER=1
    -DWITH_HYMER=1
    -DWITH_TRUMA_CPPLUS=0
    -DWITH_TRUMA_INETX=1
    -DTRUMA_LIN_UART=2
    -DTRUMA_LIN_RX=-1
    -DTRUMA_LIN_TX=-1
    -DTRUMA_LIN_EN=-1
    -DWITH_ALDE=0
    -DALDE_MODEL=3030
    -DALDE_BAUD=19200
    -DALDE_CHECKSUM=0
    -DALDE_LIN_UART=2
    -DALDE_LIN_RX=-1
    -DALDE_LIN_TX=-1
    -DALDE_LIN_EN=-1
    -DALDE_RED_UART=1
    -DALDE_RED_RX=-1

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    ; Bluetooth ueber den C6 (esp-hosted): esp-nimble-cpp nutzt den NimBLE-Stack des Frameworks (gleiche Klassen wie
    ; NimBLE-Arduino). NimBLE-Arduino bringt einen eigenen Stack mit, der einen Controller im Chip erwartet.
    h2zero/esp-nimble-cpp@^2.6.0

; ---- Hardware-Test (src/p4test/): Testbild, Touch-Punkte, WLAN-Suche ueber den C6, Ausgabe seriell 115200 ----
; Prueft die Board-Tabelle am echten Board, bevor das Panel darauf laeuft. Panel-Menue: "crowpanel-p4-test".
[env:crowpanel-p4-test]
extends = env:crowpanel-p4
build_src_filter = -<*> +<p4test/> +<board_p4_boards.cpp>
extra_scripts = post:../tools/upload_wait.py
lib_deps =

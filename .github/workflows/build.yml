# Simple Open Camper – Firmware auf GitHub bauen
# Baut bei jedem Push auf main (und auf Knopfdruck unter "Actions") Panel (S3, P4, CrowPanel 1.46"), Satelliten,
# Victron-Display, Updater und Display-Test. Die fertigen .bin-Dateien haengen als "Artifacts" am jeweiligen Lauf und
# liegen nach jedem Push auf main zusaetzlich im Ordner release/ (je Board eine Komplettdatei, dazu release/ota/).
#   Panel per Web-Editor aktualisieren: firmware.bin unter Info -> Firmware aktualisieren
#   Per USB: bootloader.bin @0x0 (P4: @0x2000), partitions.bin @0x8000, firmware.bin @0x10000 (esptool)
# Pakete und Framework liegen im Cache; der erste Lauf dauert laenger (Framework-Neubau wegen custom_sdkconfig).
name: Firmware bauen

# Nur von Hand starten (Actions -> "Firmware bauen" -> Run workflow) – Wunsch des Nutzers 2026-11-19:
# Freiminuten des privaten Repos sind knapp, gebaut wird nur auf Ansage.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Panel
            dir: .
            envs: waveshare-7b check-all
            artifact: panel-waveshare-7b
            out: .pio/build/waveshare-7b
          - name: Panel P4
            dir: p4
            envs: crowpanel-p4
            artifact: panel-crowpanel-p4
            out: p4/.pio/build/crowpanel-p4
          - name: Zigbee-Modul
            dir: h2
            envs: zigbee-h2
            artifact: zigbee-h2
            out: h2/.pio/build/zigbee-h2
          - name: CrowPanel 1.46
            dir: crowpanel146
            envs: crowpanel-146
            artifact: panel-crowpanel-146
            out: crowpanel146/.pio/build/crowpanel-146
          - name: Satelliten
            dir: satellite
            envs: esp32 esp32-c3 esp32-s3 esp32-c6 esp32-relay16 esp32-cyd
            artifact: satelliten
            out: satellite/.pio/build
          - name: Victron-Display
            dir: satellite
            envs: esp32-cyd-victron esp32-cyd-victron-en esp32-cyd-remote esp32-updater
            artifact: victron-display
            out: satellite/.pio/build
          - name: Display-Test
            dir: display-testing
            envs: waveshare-7b-display-testing
            artifact: panel-display-testing
            out: display-testing/.pio/build/waveshare-7b-display-testing

    steps:
      # Der Runner hat nur ~14 GB frei; die Pakete fuer alle Chips sprengen das (Satelliten: "No space left on device")
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Die pioarduino-Plattform legt sich ~/.platformio/penv an und installiert dort "pioarduino>=6.2.0" – also die
      # neueste Version 6.2.0.post1. Die meldet sich als "6.2.0-post.1", das gilt als Vorabversion (< 6.2.0), und die
      # Plattform bricht nach dem Framework-Neubau ab ("IncompatiblePlatform ... depends on PlatformIO Core >=6.2.0").
      # Deshalb die Umgebung selbst anlegen, mit fester Version 6.2.0 wie lokal. Erfuellt ">=6.2.0", nichts wird ersetzt.
      - name: PlatformIO installieren
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install "platformio==6.2.0" "pioarduino==6.2.0"
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Cache (Plattform, Pakete, Framework)
        uses: actions/cache@v5
        with:
          # penv nicht cachen: kaeme sonst aus alten Laeufen mit 6.2.0.post1 zurueck
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            ${{ matrix.dir }}/.pio
            satellite/.pio/packages
          key: pio2-${{ matrix.artifact }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}-${{ github.sha }}
          restore-keys: |
            pio2-${{ matrix.artifact }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}-
            pio2-${{ matrix.artifact }}-

      - name: Bauen
        env:
          PANEL_UPLOAD_NOWAIT: '1'
        run: |
          pio --version
          mkdir -p dist
          for e in ${{ matrix.envs }}; do
            echo "::group::$e"
            pio run -d "${{ matrix.dir }}" -e "$e"
            # gleich einsammeln: der naechste "pio run" kann den ganzen Build-Ordner leeren (PlatformIO-Pruefsumme
            # ueber die Header in src/ – z. B. nach dem erzeugten Startbild), dann waeren die Dateien weg
            if [ "$e" != "check-all" ]; then
              src="${{ matrix.out }}"
              [ -f "$src/firmware.bin" ] || src="${{ matrix.out }}/$e"
              if [ -f "$src/firmware.bin" ]; then
                mkdir -p "dist/$e"
                cp "$src/"{firmware,bootloader,partitions}.bin "dist/$e/" 2>/dev/null || true
                cp "$src/firmware.factory.bin" "dist/$e/" 2>/dev/null || true
              fi
            fi
            echo "::endgroup::"
          done

      - name: Groesse der Firmware
        run: |
          for f in $(find "${{ matrix.out }}" -name firmware.bin 2>/dev/null); do
            echo "$f: $(stat -c %s "$f") Bytes"
          done
          df -h /

      # je Umgebung ein Ordner dist/<umgebung>/ (Satelliten/Victron-Display: mehrere Umgebungen unter .pio/build)
      - name: Firmware einsammeln
        run: ls -lR dist   # eingesammelt wird schon beim Bauen (siehe dort)

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  # Treiberliste fuer das Zigbee-Funkmodul (ESP32-H2) aus der Geraetedatenbank von Zigbee2MQTT
  # (zigbee-herdsman-converters, MIT, Version in tools/z2m_version.txt) – Format: src/zb_drivers.h
  drivers:
    name: Zigbee-Treiber
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Geraetedatenbank laden
        run: |
          V=$(tr -d '[:space:]' < tools/z2m_version.txt)
          echo "zigbee-herdsman-converters $V"
          npm install --prefix z2m --no-audit --no-fund --omit=dev "zigbee-herdsman-converters@$V"
      - name: Treiberliste erzeugen
        run: |
          mkdir -p dist
          node tools/z2m_drivers.js z2m/node_modules dist/zb_drivers.bin dist/zb_drivers.md
          cat dist/zb_drivers.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: zigbee-treiber
          path: dist/
          retention-days: 30

  # Nach jedem Push auf main: pro Board eine Datei in release/ (Komplettdatei fuer USB, Adresse 0x0) und die reine
  # Firmware fuer das Update ueber die Weboberflaeche in release/ota/. Commit nur, wenn sich etwas geaendert hat.
  publish:
    name: Firmware nach release/ legen
    needs: [build, drivers]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VTOKEN: ${{ secrets.VICTRON_SYNC_TOKEN }}   # fuer die Victron-Display-Dateien im Victron-Repo (leer = auslassen)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          path: art
      - name: esptool installieren
        run: pip install esptool
      - name: Dateien je Board zusammenstellen
        run: |
          set -e
          VER=$(sed -n 's/.*SOC_VERSION "\([^"]*\)".*/\1/p' src/soc_version.h)
          SHA=${GITHUB_SHA::7}
          echo "Version $VER ($SHA)"
          mkdir -p new/ota release/ota release/vorher/ota
          # Umgebung -> Dateiname in release/
          declare -A NAME=(
            [waveshare-7b]=panel-waveshare-7b
            [crowpanel-p4]=panel-crowpanel-p4
            [crowpanel-146]=panel-crowpanel-146
            [esp32-cyd-victron]=victron-display-cyd
            [esp32-cyd-victron-en]=victron-display-cyd-en
            [esp32]=satellit-esp32
            [esp32-c3]=satellit-esp32-c3
            [esp32-s3]=satellit-esp32-s3
            [esp32-c6]=satellit-esp32-c6
            [esp32-relay16]=satellit-relay16
            [esp32-cyd]=satellit-cyd
            [esp32-cyd-remote]=zusatzdisplay-cyd
            [zigbee-h2]=zigbee-modul-h2
          )
          UPD=$(ls art/*/esp32-updater/firmware.bin 2>/dev/null | head -1 || true)
          ZBD=$(ls art/zigbee-treiber/zb_drivers.bin 2>/dev/null | head -1 || true)
          [ -n "$ZBD" ] && cp "$ZBD" new/zb_drivers.bin && cp art/zigbee-treiber/zb_drivers.md new/zb_drivers.md 2>/dev/null || true
          for d in art/*/*/; do
            e=$(basename "$d")
            n=${NAME[$e]:-}
            [ -n "$n" ] || continue
            [ -f "$d/firmware.bin" ] && cp "$d/firmware.bin" "new/ota/$n.bin"
            if [ -f "$d/firmware.factory.bin" ]; then
              if { [ "$e" = "esp32-cyd-victron" ] || [ "$e" = "esp32-cyd-victron-en" ] || [ "$e" = "esp32-cyd-remote" ]; } && [ -n "$UPD" ]; then
                # Victron-Display/Zusatzdisplay: Updater (app1, 0x2F0000) gleich mit in die Komplettdatei
                python -m esptool --chip esp32 merge-bin -o "new/$n.bin" 0x0 "$d/firmware.factory.bin" 0x2F0000 "$UPD"
              elif [ "$e" = "zigbee-h2" ] && [ -n "$ZBD" ]; then
                # Zigbee-Modul: Treiberliste (Bereich zbdrv, 0x1F0000) gleich mit in die Komplettdatei
                python -m esptool --chip esp32h2 merge-bin -o "new/$n.bin" 0x0 "$d/firmware.factory.bin" 0x1F0000 "$ZBD"
              else
                cp "$d/firmware.factory.bin" "new/$n.bin"
              fi
            fi
          done
          [ -n "$UPD" ] && cp "$UPD" new/ota/updater-esp32.bin
          # bisherige Fassung nach release/vorher/, neue nach release/ – nur fuer Dateien, die sich geaendert haben
          declare -A CUR PREV
          [ -f release/versionen.txt ] && while read -r k v; do [ -n "$k" ] && CUR[$k]="$v"; done < release/versionen.txt
          [ -f release/vorher/versionen.txt ] && while read -r k v; do [ -n "$k" ] && PREV[$k]="$v"; done < release/vorher/versionen.txt
          for f in $(cd new && find . -name '*.bin' | sed 's|^\./||' | sort); do
            if [ -f "release/$f" ] && cmp -s "release/$f" "new/$f"; then continue; fi
            if [ -f "release/$f" ]; then
              mv "release/$f" "release/vorher/$f"
              PREV[$f]="${CUR[$f]:-unbekannt}"
            fi
            cp "new/$f" "release/$f"
            CUR[$f]="$VER ($SHA)"
          done
          : > release/versionen.txt
          for k in $(printf '%s\n' "${!CUR[@]}" | sort); do echo "$k ${CUR[$k]}" >> release/versionen.txt; done
          : > release/vorher/versionen.txt
          for k in $(printf '%s\n' "${!PREV[@]}" | sort); do echo "$k ${PREV[$k]}" >> release/vorher/versionen.txt; done
          kb() { [ -f "$1" ] && echo "$(( $(stat -c %s "$1") / 1024 )) KB" || echo "–"; }
          {
            echo "# Fertige Firmware – Version $VER"
            echo
            echo "Automatisch von GitHub gebaut (zuletzt aus Commit $SHA, $(date -u '+%Y-%m-%d %H:%M') UTC)."
            echo "Die jeweils vorige Fassung liegt in [\`vorher/\`](vorher/)."
            echo
            echo "**Per USB (komplett, Adresse 0x0):** die Datei des Boards in diesem Ordner, z. B."
            echo "\`esptool.py write_flash 0x0 panel-waveshare-7b.bin\` – fuer neue Geraete. **Achtung: loescht die Einstellungen**"
            echo "(WLAN, Geraete, Kacheln), weil die Datei auch den Einstellungsbereich enthaelt."
            echo
            echo "**Per USB, Einstellungen behalten:** die gleichnamige Datei aus \`ota/\` an Adresse 0x10000, z. B."
            echo "\`esptool.py write_flash 0x10000 ota/panel-waveshare-7b.bin\`."
            echo
            echo "**Ueber die Weboberflaeche (Update):** die gleichnamige Datei in \`ota/\`."
            echo
            echo "| Board | Version | Komplett (USB) | Update (Weboberflaeche) | vorige Fassung |"
            echo "|---|---|---|---|---|"
            for f in $(ls release/ota/*.bin 2>/dev/null | sort); do
              b=$(basename "$f" .bin)
              full="–"; [ -f "release/$b.bin" ] && full="[$b.bin]($b.bin) ($(kb "release/$b.bin"))"
              prev="–"; [ -f "release/vorher/ota/$b.bin" ] && prev="${PREV[ota/$b.bin]:-?}: [komplett](vorher/$b.bin), [Update](vorher/ota/$b.bin)"
              echo "| $b | ${CUR[ota/$b.bin]:-?} | $full | [ota/$b.bin](ota/$b.bin) ($(kb "$f")) | $prev |"
            done
            if [ -f release/zb_drivers.bin ]; then
              echo
              echo "**Zigbee-Modul (ESP32-H2):** [zb_drivers.bin](zb_drivers.bin) ($(kb release/zb_drivers.bin)) = Geraetetreiber allein,"
              echo "per USB nach \`0x1F0000\` – das Programm (\`ota/zigbee-modul-h2.bin\` nach \`0x10000\`) bleibt dabei unberuehrt."
            fi
          } > release/README.md
          ls -lR release
      - name: Committen (nur bei Aenderungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release
          if git diff --cached --quiet -- release; then
            echo "Keine geaenderte Firmware – nichts zu committen"
            exit 0
          fi
          git commit -q -m "Firmware-Dateien aus ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      # Victron-Display: die fertigen Dateien zusaetzlich ins abgespeckte Repo (simply-open-camper-victron-beta), dort in
      # release/ (komplett inkl. Updater, ota/ fuer die Weboberflaeche, vorher/ = vorige Fassung). Braucht das Secret
      # VICTRON_SYNC_TOKEN (wie der Quellcode-Abgleich, sync-victron.yml).
      - name: Victron-Repo holen
        if: ${{ env.VTOKEN != '' }}
        uses: actions/checkout@v5
        with:
          repository: cyclemat/simply-open-camper-victron-beta
          token: ${{ secrets.VICTRON_SYNC_TOKEN }}
          path: victron
      - name: Victron-Display-Dateien ins Victron-Repo
        if: ${{ env.VTOKEN != '' }}
        run: |
          set -e
          [ -d victron ] || { echo "Victron-Repo nicht geholt"; exit 0; }
          mkdir -p victron/release/ota victron/release/vorher/ota
          n=victron-display-cyd
          # Deutsch (victron-display-cyd) und Englisch (victron-display-cyd-en)
          for m in "$n" "$n-en"; do
            for p in "$m.bin" "ota/$m.bin" "vorher/$m.bin" "vorher/ota/$m.bin"; do
              [ -f "release/$p" ] && cp "release/$p" "victron/release/$p"
            done
          done
          for p in "ota/updater-esp32.bin" "vorher/ota/updater-esp32.bin"; do
            [ -f "release/$p" ] && cp "release/$p" "victron/release/$p"
          done
          VER=$(sed -n 's/.*SOC_VERSION "\([^"]*\)".*/\1/p' src/soc_version.h)
          {
            echo "# Fertige Firmware – Victron-Display (CYD), Version $VER"
            echo
            echo "Automatisch gebaut. Die vorige Fassung liegt in [\`vorher/\`](vorher/)."
            echo
            echo "| Datei | Wofuer |"
            echo "|---|---|"
            echo "| [$n.bin]($n.bin) | **Erstes Aufspielen per USB** (Deutsch): komplett (Bootloader, Partitionen, Firmware, Updater) – \`esptool.py write_flash 0x0 $n.bin\` |"
            echo "| [$n-en.bin]($n-en.bin) | dasselbe auf **Englisch** / **first install via USB** (English) |"
            echo "| [ota/$n.bin](ota/$n.bin) | **Update ueber die Weboberflaeche** des Displays (Deutsch) |"
            echo "| [ota/$n-en.bin](ota/$n-en.bin) | **Update via the web interface** (English) |"
            echo "| [ota/updater-esp32.bin](ota/updater-esp32.bin) | nur der kleine Updater (Adresse 0x2F0000), normalerweise nicht noetig |"
          } > victron/release/README.md
          cd victron
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -q -m "Fertige Firmware $VER"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

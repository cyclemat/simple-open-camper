# Simply Open Camper – Firmware auf GitHub bauen
# Baut bei jedem Push auf main (und auf Knopfdruck unter "Actions") Panel (S3 und P4), Satelliten, Victron-Display
# und Display-Test. Die fertigen .bin-Dateien haengen als "Artifacts" am jeweiligen Lauf (Actions -> Lauf -> unten).
#   Panel per Web-Editor aktualisieren: firmware.bin unter Info -> Firmware aktualisieren
#   Per USB: bootloader.bin @0x0 (P4: @0x2000), partitions.bin @0x8000, firmware.bin @0x10000 (esptool)
# Pakete und Framework liegen im Cache; der erste Lauf dauert laenger (Framework-Neubau wegen custom_sdkconfig).
name: Firmware bauen

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'assets/banner.png']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Panel
            dir: .
            envs: waveshare-7b check-all
            artifact: panel-waveshare-7b
            out: .pio/build/waveshare-7b
          - name: Panel P4
            dir: p4
            envs: crowpanel-p4
            artifact: panel-crowpanel-p4
            out: p4/.pio/build/crowpanel-p4
          - name: Satelliten
            dir: satellite
            envs: esp32 esp32-c3 esp32-s3 esp32-c6 esp32-relay16 esp32-cyd
            artifact: satelliten
            out: satellite/.pio/build
          - name: Victron-Display
            dir: satellite
            envs: esp32-cyd-victron
            artifact: victron-display
            out: satellite/.pio/build/esp32-cyd-victron
          - name: Display-Test
            dir: display-testing
            envs: waveshare-7b-display-testing
            artifact: panel-display-testing
            out: display-testing/.pio/build/waveshare-7b-display-testing

    steps:
      # Der Runner hat nur ~14 GB frei; die Pakete fuer alle Chips sprengen das (Satelliten: "No space left on device")
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Die pioarduino-Plattform legt sich ~/.platformio/penv an und installiert dort "pioarduino>=6.2.0" – also die
      # neueste Version 6.2.0.post1. Die meldet sich als "6.2.0-post.1", das gilt als Vorabversion (< 6.2.0), und die
      # Plattform bricht nach dem Framework-Neubau ab ("IncompatiblePlatform ... depends on PlatformIO Core >=6.2.0").
      # Deshalb die Umgebung selbst anlegen, mit fester Version 6.2.0 wie lokal. Erfuellt ">=6.2.0", nichts wird ersetzt.
      - name: PlatformIO installieren
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install "platformio==6.2.0" "pioarduino==6.2.0"
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Cache (Plattform, Pakete, Framework)
        uses: actions/cache@v4
        with:
          # penv nicht cachen: kaeme sonst aus alten Laeufen mit 6.2.0.post1 zurueck
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            ${{ matrix.dir }}/.pio
          key: pio2-${{ matrix.artifact }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}-${{ github.sha }}
          restore-keys: |
            pio2-${{ matrix.artifact }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}-
            pio2-${{ matrix.artifact }}-

      - name: Bauen
        env:
          PANEL_UPLOAD_NOWAIT: '1'
        run: |
          pio --version
          for e in ${{ matrix.envs }}; do
            echo "::group::$e"
            pio run -d "${{ matrix.dir }}" -e "$e"
            echo "::endgroup::"
          done

      - name: Groesse der Firmware
        run: |
          for f in $(find "${{ matrix.out }}" -name firmware.bin 2>/dev/null); do
            echo "$f: $(stat -c %s "$f") Bytes"
          done
          df -h /

      - name: Firmware einsammeln
        run: |
          mkdir -p dist
          if [ "${{ matrix.name }}" = "Satelliten" ]; then
            for e in ${{ matrix.envs }}; do
              mkdir -p "dist/$e"
              cp "${{ matrix.out }}/$e/"{firmware,bootloader,partitions}.bin "dist/$e/" 2>/dev/null || true
            done
          else
            cp "${{ matrix.out }}/"{firmware,bootloader,partitions}.bin dist/ 2>/dev/null || true
          fi
          ls -lR dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

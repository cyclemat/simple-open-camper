<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simply Open Camper – Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='22' rx='5' fill='%2310131a'/%3E%3Crect x='7' y='12' width='8' height='9' rx='2' fill='%23f3a43b'/%3E%3Crect x='17' y='12' width='8' height='9' rx='2' fill='%23394350'/%3E%3C/svg%3E">
<style>
/*@@FONTS@@*/
:root{
  --bench:#E3E6EA; --surface:#F5F6F8; --raised:#FFFFFF; --ink:#161A20; --muted:#58626E; --faint:#8A949F;
  --line:#D0D5DB; --line-soft:#E2E6EA; --amber:#F3A43B; --amber-deep:#DD7B1F; --amber-ink:#3A2204;
  --signal:#2C68E0; --signal-soft:rgba(44,104,224,.12); --danger:#C23E2D; --ok:#2E9D5B;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 28px rgba(20,24,30,.08);
  --font:'Inter Panel',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bench:#0E1013; --surface:#16191E; --raised:#1D2127; --ink:#E6EAEE; --muted:#9AA4AF; --faint:#6D7782;
    --line:#2B3138; --line-soft:#23282E; --amber:#F3A43B; --amber-deep:#FFB95C; --amber-ink:#2A1703;
    --signal:#5C93FF; --signal-soft:rgba(92,147,255,.16); --danger:#FF7564; --ok:#4CC27E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 14px/1.45 var(--font);color:var(--ink);background:var(--bench);-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
button,input,select{font:inherit;color:inherit}
.ic{flex:none;display:block}
.num{font-feature-settings:'tnum'}

/* ---------- Rahmen ---------- */
.app{height:100%;display:grid;grid-template-rows:56px 1fr;grid-template-columns:300px minmax(0,1fr) 320px;grid-template-areas:"top top top" "list stage insp"}
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand-mark{width:30px;height:22px;border-radius:6px;background:#10131A;position:relative}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;top:6px;width:9px;height:10px;border-radius:2px}
.brand-mark::before{left:5px;background:var(--amber)}
.brand-mark::after{right:5px;background:#3A4350}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--amber)} .dot.bad{background:var(--danger)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--raised);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover:not(:disabled){background:var(--amber-deep);border-color:var(--amber-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.small{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:36px;padding:0;justify-content:center}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.demo-banner{background:var(--amber);color:var(--amber-ink);font-weight:500;font-size:13px;padding:4px 10px;border-radius:6px;white-space:nowrap}

/* ---------- Geraeteliste ---------- */
.list{grid-area:list;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:14px 14px 10px}
.list-head h2,.insp h2{font-size:16px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.list-head h2 .count{color:var(--faint);font-weight:400;font-size:13px}
.search{position:relative}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--raised);padding:0 10px 0 34px}
.search .ic{position:absolute;left:10px;top:9px;color:var(--faint)}
.list-body{overflow:auto;padding:0 8px 16px;flex:1}
.group-title{font-size:12px;color:var(--faint);padding:14px 8px 6px;font-weight:500}
.dev{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:grab;user-select:none;touch-action:none}
.dev:hover{background:var(--line-soft)}
.dev.placed{cursor:pointer}
.dev.offline{opacity:.55}
.dev .sw{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;border:1px solid transparent}
.dev .tx{min-width:0;flex:1}
.dev .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .pg{font-size:12px;color:var(--muted);background:var(--line-soft);padding:2px 7px;border-radius:999px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.dev .add{opacity:0}
.dev:hover .add,.dev:focus-within .add{opacity:1}
.empty{color:var(--muted);padding:12px 8px;font-size:13px}

/* ---------- Buehne mit Panel ---------- */
.stage{grid-area:stage;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;padding:24px;gap:14px;overflow:hidden}
.bezel{padding:16px;border-radius:26px;background:#07080A;box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 2px 0 rgba(255,255,255,.05) inset,0 24px 60px rgba(10,14,20,.28),0 6px 16px rgba(10,14,20,.18)}
.screenwrap{position:relative;overflow:hidden;border-radius:4px}
.screen{position:absolute;left:0;top:0;width:1024px;height:600px;transform-origin:0 0;background:#0F1215;overflow:hidden;font-family:var(--font);color:#E9EDF1;user-select:none}
.screen .bg{position:absolute;inset:0;width:1024px;height:600px;object-fit:cover;display:none}
.pbar{position:absolute;left:0;top:0;width:1024px;height:56px;background:#0B0D10;border-bottom:1px solid #232A31;display:flex;align-items:stretch}
.pbar.trans{background:rgba(11,13,16,.7)}
.ptabs{display:flex;padding-left:8px;max-width:700px;overflow:hidden}
.ptab{padding:0 14px;display:flex;align-items:center;font:500 20px/25px var(--font);color:#8D97A2;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.ptab.act{color:#E9EDF1;border-bottom-color:#F3A43B}
.ptab.single{font:600 26px/33px var(--font);color:#E9EDF1;cursor:default;border-bottom-color:transparent}
.ptab.addpage{color:#5E6873;font-size:18px;gap:6px;border-bottom:0}
.ptab.addpage:hover{color:#E9EDF1}
.pstat{position:absolute;right:68px;top:0;height:56px;display:flex;align-items:center;gap:14px;color:#8D97A2}
.pstat .clock{font:600 26px/33px var(--font);color:#E9EDF1;font-feature-settings:'tnum'}
.pgear{position:absolute;right:20px;top:16px;color:#8D97A2}
.content{position:absolute;left:0;top:56px;width:1024px;height:544px;touch-action:none}
.content.gridon{background-image:radial-gradient(circle,rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:var(--g) var(--g);background-position:calc(var(--g)/-2) calc(var(--g)/-2)}

/* Kacheln – Masse und Farben exakt wie auf dem Panel */
.tile{position:absolute;border-radius:18px;border:1px solid #272E36;overflow:visible;cursor:move;box-sizing:border-box}
.tile .ti{position:absolute;left:14px;top:12px;line-height:0}
.tile .tn{position:absolute;left:14px;right:14px;bottom:38px;font:500 20px/25px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{position:absolute;left:14px;bottom:16px;font:400 16px/20px var(--font);white-space:pre;font-feature-settings:'tnum'}
.tile .tb{position:absolute;left:14px;right:14px;bottom:5px;height:4px;border-radius:2px;overflow:hidden}
.tile .tb span{display:block;height:4px;border-radius:2px}
.tile.big .ti{left:18px;top:16px}
.tile.big .tn{left:18px;right:18px;font:600 26px/33px var(--font)}
.tile.big .ts{left:18px}
.tile.small .ti{top:50%;transform:translateY(-50%)}
.tile.small .tn{left:50px;bottom:auto;right:14px}
.tile.small .ts{left:50px;bottom:auto}
.tile .tclip{position:absolute;inset:0;border-radius:17px;overflow:hidden;pointer-events:none}
.tile .tfill{position:absolute;left:0;right:0;bottom:0;opacity:.3}
.tile .tp{position:absolute;right:14px;top:10px;font:600 26px/33px var(--font);font-feature-settings:'tnum'}
.tile.big .tp{right:18px;top:14px;font:600 40px/49px var(--font)}
.tile.small .tp{top:50%;transform:translateY(-50%)}
.tile.gas.small .tn{right:84px}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.readout div{background:var(--raised);border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px}
.readout span{display:block;font-size:12px;color:var(--muted)}
.readout b{font-weight:600;font-feature-settings:'tnum'}
.gasrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.gasrow .st{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.tile.sel{outline:calc(2px * var(--inv)) solid #5C93FF;outline-offset:calc(3px * var(--inv));z-index:5}
.tile.overlap::after{content:"";position:absolute;inset:-1px;border-radius:18px;border:calc(2px * var(--inv)) dashed #FF6A5C;pointer-events:none}
.tile.dragging{opacity:.92;z-index:6}
.hd{position:absolute;width:calc(12px * var(--inv));height:calc(12px * var(--inv));background:#fff;border:calc(2px * var(--inv)) solid #5C93FF;border-radius:50%;z-index:7}
.hd[data-h=nw]{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.hd[data-h=ne]{right:0;top:0;transform:translate(50%,-50%);cursor:nesw-resize}
.hd[data-h=sw]{left:0;bottom:0;transform:translate(-50%,50%);cursor:nesw-resize}
.hd[data-h=se]{right:0;bottom:0;transform:translate(50%,50%);cursor:nwse-resize}
.hd[data-h=n]{left:50%;top:0;transform:translate(-50%,-50%);cursor:ns-resize}
.hd[data-h=s]{left:50%;bottom:0;transform:translate(-50%,50%);cursor:ns-resize}
.hd[data-h=w]{left:0;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.hd[data-h=e]{right:0;top:50%;transform:translate(50%,-50%);cursor:ew-resize}
.drop{position:absolute;border-radius:18px;border:calc(2px * var(--inv)) dashed #F3A43B;background:rgba(243,164,59,.12);pointer-events:none;display:none}
.guide{position:absolute;background:#5C93FF;pointer-events:none;z-index:8}
.guide.v{top:0;width:calc(1px * var(--inv));height:544px}
.guide.h{left:0;height:calc(1px * var(--inv));width:1024px}
.sizetag{position:absolute;z-index:9;background:#5C93FF;color:#fff;font:500 calc(12px * var(--inv))/1 var(--font);padding:calc(4px * var(--inv)) calc(6px * var(--inv));border-radius:calc(5px * var(--inv));pointer-events:none;white-space:nowrap;font-feature-settings:'tnum'}
.emptyhint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#5E6873;font:400 20px/1.5 var(--font);pointer-events:none}
.stagebar{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap;justify-content:center}
.stagebar label{display:flex;align-items:center;gap:6px}
.stagebar select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:0 6px}
.ghost-drag{position:fixed;z-index:1000;pointer-events:none;padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--surface);font-weight:500;box-shadow:var(--shadow);transform:translate(12px,12px);white-space:nowrap}

/* ---------- Eigenschaften ---------- */
.insp{grid-area:insp;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px}
.sec{padding:14px 0;border-top:1px solid var(--line-soft)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h3{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--line-soft);color:var(--muted)}
.chip.on{background:rgba(243,164,59,.18);color:var(--amber-deep)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--raised);padding:0 10px;width:100%}
.field input:focus,.field select:focus{border-color:var(--signal);outline:none;box-shadow:0 0 0 3px var(--signal-soft)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .field{margin:0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--raised);display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.icons button:hover{color:var(--ink);border-color:var(--faint)}
.icons button.act{border-color:var(--signal);color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.icons .auto{font-size:11px;font-weight:600}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.presets button{border:1px solid var(--line);border-radius:9px;background:var(--raised);cursor:pointer;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.presets button i{display:block;background:var(--faint);border-radius:2px}
.presets button.act{border-color:var(--signal);color:var(--signal)}
.presets button.act i{background:var(--signal)}
.warn{background:rgba(194,62,45,.08);border:1px solid rgba(194,62,45,.25);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.bgthumb{width:100%;aspect-ratio:1024/600;border-radius:10px;border:1px solid var(--line);background:#0F1215 center/cover no-repeat;margin-bottom:8px;display:grid;place-items:center;color:#5E6873;font-size:13px}
.state-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}

/* ---------- Dialoge, Meldungen ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,14,18,.45);display:grid;place-items:center;z-index:100;padding:20px}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;border:1px solid var(--line)}
.dlg.wide{width:min(760px,100%)}
.dlg header{padding:18px 20px 6px;display:flex;align-items:center;gap:10px}
.dlg header h2{font-size:18px;font-weight:600;margin:0;flex:1}
.dlg .body{padding:6px 20px 16px;overflow:auto}
.dlg footer{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:6px 20px 0;border-bottom:1px solid var(--line-soft)}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.act{color:var(--ink);border-bottom-color:var(--amber)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mode{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--raised);text-align:left}
.mode b{display:block;font-weight:600;margin-bottom:4px}
.mode span{font-size:12px;color:var(--muted)}
.mode.act{border-color:var(--amber);box-shadow:0 0 0 3px rgba(243,164,59,.18)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.progress{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:var(--amber);width:0}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:500;max-width:min(560px,90vw);animation:tin .18s ease-out}
.toast.error{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
canvas.bgprev{width:100%;aspect-ratio:1024/600;border-radius:10px;background:#0F1215;display:block}
input[type=range]{width:100%;accent-color:var(--amber)}
.switch{display:flex;align-items:center;gap:10px;margin:4px 0 12px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--amber)}
.saverbox{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:4px}
canvas.saverprev{width:100%;aspect-ratio:1024/600;border-radius:10px;background:#000;display:block;border:6px solid #07080A}
.logorow{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start}
.logothumb{aspect-ratio:16/10;border-radius:10px;background:#000;display:grid;place-items:center;color:#5E6873;font-size:12px;text-align:center;padding:8px}
.logothumb img{max-width:100%;max-height:100%}
@media (max-width:640px){.saverbox,.logorow{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1180px){
  .app{height:auto;min-height:100%;grid-template-columns:260px minmax(0,1fr);grid-template-rows:56px 560px auto;grid-template-areas:"top top" "list stage" "insp insp"}
  .list{max-height:560px}
  .insp{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 28px;align-items:start;overflow:visible}
  .insp .sec:first-of-type{padding-top:14px}
  .bgthumb{max-width:360px}
}
@media (max-width:760px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  .top{height:auto;flex-wrap:wrap;padding:10px 12px}
  .stage{min-height:320px;padding:12px}
  .list{max-height:360px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Simply Open Camper</div>
    <div class="status" id="status"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnUndo" title="Rückgängig (Strg+Z)"></button>
    <button class="btn ghost" id="btnSettings"></button>
    <button class="btn primary" id="btnSave" title="Speichern (Strg+S)"></button>
  </header>

  <aside class="list" aria-label="Geräte">
    <div class="list-head">
      <h2>Geräte <span class="count num" id="devCount"></span></h2>
      <div class="search"><span id="searchIcon"></span><input id="search" type="search" placeholder="Suchen" autocomplete="off"></div>
    </div>
    <div class="list-body" id="devList"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="bezel" id="bezel">
      <div class="screenwrap" id="screenwrap">
        <div class="screen" id="screen">
          <img class="bg" id="bg" alt="">
          <div class="pbar" id="pbar"></div>
          <div class="content" id="content"></div>
        </div>
      </div>
    </div>
    <div class="stagebar">
      <span>Ziehe Geräte aus der Liste auf das Panel. Langes Drücken am Panel öffnet die Regler.</span>
      <label>Raster
        <select id="gridSel"><option value="1">aus</option><option value="4">4 px</option><option value="8">8 px</option><option value="16">16 px</option></select>
      </label>
    </div>
  </main>

  <aside class="insp" id="insp" aria-label="Eigenschaften"></aside>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/*@@ICONS@@*/
const W = 1024, H = 600, BAR = 56, CH = H - BAR, GAP = 16, DEF_W = 184, DEF_H = 116;
const PRESETS = [

let LANG = 'de', TRX = new Map(), TRP = [];

  LANG = l && I18N[l] ? l : 'de';

    if (!v) continue;
    if (k.includes('{}')) TRP.push([new RegExp('^' + k.split('{}').map(s => s.replace(/[.*+?^$()|[\]\\]/g, '\\$&')).join('(.*?)') + '$'), v]);

}
function T(s) {

  if (!t) return s;
  let r = TRX.get(t);
  if (r == null) {
    for (const [re, v] of TRP) {
      const m = t.match(re);
      if (m) { let i = 1; r = v.replace(/\{\}/g, () => m[i++] ?? ''); break; }

function modal({title, body, actions = [], wide = false, onClose}) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button class="btn ghost icon" data-x aria-label="Schließen">${icon('close', 18)}</button></header>
    <div class="body"></div><footer></footer></div>`;
  const dlg = scrim.firstElementChild;
  const b = $('.body', dlg);
  if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('pointerdown', e => { if (e.target === scrim) close(); });
  $('[data-x]', dlg).onclick = close;
  const f = $('footer', dlg);
  if (!actions.length) f.remove();
  for (const a of actions) {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (a.kind || '');
    btn.textContent = a.label;
    btn.onclick = () => a.onClick ? a.onClick(close, btn) : close();
    f.appendChild(btn);
  }
  document.body.appendChild(scrim);
  const first = $('input,select,button.primary', dlg);
  if (first) setTimeout(() => first.focus(), 30);
  return {close, el: dlg};
}
function confirmDlg(title, text, okLabel, danger = false) {
  return new Promise(res => {
    let done = false;
    modal({title, body: `<p style="margin:4px 0 6px;color:var(--muted)">${esc(text)}</p>`, onClose: () => !done && res(false),
      actions: [{label: 'Abbrechen', kind: 'ghost'},
        {label: okLabel, kind: danger ? 'danger' : 'primary', onClick: c => { done = true; c(); res(true); }}]});
  });
}

const vnum = (v, dec, unit) => v == null ? '–' : (v < 0 ? '−' : '') + Math.abs(v).toFixed(dec).replace('.', ',') + ' ' + unit;

// ------------------------------------------------------------------ Modell
const page = () => S.layout.pages[S.page];
const defName = d => d.name + (d.ep ? ' ' + d.ep : '');
const labelOf = d => (S.layout.names[d.key] || '').trim() || defName(d);
function tileLabel(t) {
  const d = S.dev.get(t.key);
  return d ? labelOf(d) : (S.layout.names[t.key] || 'Unbekanntes Gerät');
}
const autoIcon = d => d && d.kind === 'satio' ? (SIO_ICON[d.sio] || 'info') : d && d.kind === 'switch' ? 'plug' : d && d.kind === 'gas' ? 'gas' : d && d.kind === 'heat' ? 'flame' : d && d.kind === 'victron' ? (VIC_ICON[d.vtype] || 'bluetooth') : 'bulb';
const tileIcon = t => t.icon || autoIcon(S.dev.get(t.key));
function setDevices(list) {
  S.devices = list || [];
  S.dev = new Map(S.devices.map(d => [d.key, d]));
}
function normLayout(l) {
  l = l || {};
  l.grid = l.grid || 8;
  l.names = l.names || {};
  l.pages = (l.pages || []).map(p => ({id: p.id, name: p.name || 'Seite', bg: !!p.bg, tiles: (p.tiles || []).map(t => ({...t}))}));
  if (!l.pages.length) l.pages.push({id: 'p1', name: 'Start', bg: false, tiles: []});
  l.rev = l.rev || 0;
  return l;
}
function placements() {
  const m = new Map();
  S.layout.pages.forEach((p, pi) => p.tiles.forEach((t, ti) => { if (!m.has(t.key)) m.set(t.key, {pi, ti}); }));
  return m;
}
function pushUndo(snap) {
  S.undo.push(snap || JSON.stringify(S.layout));
  if (S.undo.length > 60) S.undo.shift();
}
function change(fn, opts = {}) {
  pushUndo();
  fn();
  S.dirty = true;
  renderAll(opts);
}
function undo() {
  if (!S.undo.length) return;
  S.layout = JSON.parse(S.undo.pop());
  S.page = clamp(S.page, 0, S.layout.pages.length - 1);
  S.sel = -1;
  S.dirty = true;
  renderAll();
}
function newPageId() {
  let id;
  do { id = 'p' + Math.random().toString(36).slice(2, 6); } while (S.layout.pages.some(p => p.id === id));
  return id;
}
function overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function freeSlot(pg, w = DEF_W, h = DEF_H) {
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
    const rect = {x: 20 + c * (DEF_W + GAP), y: 16 + r * (DEF_H + GAP), w, h};
    if (rect.x + w > W || rect.y + h > CH) continue;
    if (!pg.tiles.some(t => overlaps(rect, t))) return rect;
  }
  return null;
}
function arrange(missingOnly) {
  const placed = new Set();
  if (missingOnly) S.layout.pages.forEach(p => p.tiles.forEach(t => placed.add(t.key)));
  else S.layout.pages.forEach(p => { p.tiles = []; });
  let pi = 0, added = 0;
  for (const d of sortedDevices()) {
    if (placed.has(d.key)) continue;
    let slot = null;
    while (!slot) {
      if (pi >= S.layout.pages.length) {
        if (S.layout.pages.length >= 8) return added;
        S.layout.pages.push({id: newPageId(), name: 'Seite ' + (S.layout.pages.length + 1), bg: false, tiles: []});
      }
      slot = freeSlot(S.layout.pages[pi]);
      if (!slot) pi++;
    }
    S.layout.pages[pi].tiles.push({key: d.key, ...slot});
    added++;
  }
  return added;
}
const sortedDevices = () => [...S.devices].sort((a, b) => labelOf(a).localeCompare(labelOf(b), 'de'));

// ------------------------------------------------------------------ Darstellung einer Kachel (wie Firmware tile_paint)
function visual(t) {
  const d = S.dev.get(t.key);
  const st = (d && d.state) || {};
  const small = t.h < 96, big = t.h >= 170 && t.w >= 220;
  const online = !d || d.online !== false;
  const known = st.on !== undefined;
  const on = !!d && online && known && st.on;
  const v = {small, big, name: tileLabel(t), opacity: (!d || !online) ? .5 : 1, bar: null};
  if (on) {
    const c = displayColor(d);
    v.bg = `linear-gradient(${css(c)}, ${css(darken(c, 52))})`;
    v.border = css(lighten(c, 60), .5);
    const lightBg = lvBright(c) > 150;
    v.fg = lightBg ? [0x1E, 0x12, 0x06] : [255, 255, 255];
    v.fg2 = lightBg ? [0x4A, 0x32, 0x14] : [0xDC, 0xE6, 0xF2];
    v.ic = v.fg;
  } else {
    v.bg = '#181D22';
    v.border = '#272E36';
    v.fg = [0xE9, 0xED, 0xF1]; v.fg2 = [0x8D, 0x97, 0xA2]; v.ic = [0x9A, 0xA5, 0xB1];
  }
  if (!d) v.sub = S.devices.length ? 'nicht in Zigbee2MQTT' : '…';
  else if (!online) v.sub = 'nicht erreichbar';
  else if (!known) v.sub = '…';
  else if (!st.on) v.sub = 'Aus';
  else if (d.bri && st.bri != null) {
    v.sub = (big && d.ct && st.ct > 0 && st.mode === 'color_temp')
      ? `${st.bri}\u202F%  ·  ${Math.floor(1e6 / st.ct / 50) * 50}\u202FK` : `${st.bri}\u202F%`;
    if (t.h >= 100 && !small) v.bar = st.bri;
  } else v.sub = 'An';
  return v;
}

function gasTileHTML(t, i, overlap) {
  const d = S.dev.get(t.key);
  const st = (d && d.state) || {};
  const small = t.h < 96, big = t.h >= 170 && t.w >= 220;
  const isz = small ? 24 : big ? 44 : 32;
  const has = st.level != null;
  const col = has ? gasColor(st.level) : null;
  const name = d ? labelOf(d) : (S.layout.names[t.key] || 'Gasflasche');
  let pct = '–', sub = 'Sensor nicht eingerichtet';
  if (d && !has) { pct = '…'; sub = st.status || 'Warte auf erste Messung …'; }
  if (has) { pct = `${st.level}\u202F%`;
    const mop = t.key.startsWith('mopeka:');
    const when = st.busy ? 'misst …' : mop ? (st.status && st.status !== 'OK' ? st.status : '') : ageText(st.age);
    const amt = amountText(st);
    sub = amt + (small || !when ? '' : (amt ? '  ·  ' : '') + when);
  }
  const cls = ['tile', 'gas', small && 'small', big && 'big', i === S.sel && 'sel', overlap && 'overlap'].filter(Boolean).join(' ');
  const handles = i === S.sel ? ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(hh => `<span class="hd" data-h="${hh}"></span>`).join('') : '';
  return `<div class="${cls}" data-i="${i}" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:#181D22;border-color:#272E36;opacity:${d ? 1 : .5}">
    <span class="tclip">${has ? `<span class="tfill" style="height:${Math.round(t.h * st.level / 100)}px;background:${css(col)}"></span>` : ''}</span>
    <span class="ti" style="color:${has ? css(col) : d ? '#9AA5B1' : '#5E6873'}">${icon('gas', isz)}</span>
    <span class="tp" style="color:${has && st.level < 15 ? '#FF6A5C' : '#E9EDF1'}">${esc(pct)}</span>
    <span class="tn" data-notr style="${small ? `top:${Math.round(t.h / 2 - 24)}px;` : ''}color:#E9EDF1">${esc(name)}</span>
    <span class="ts" style="${small ? `top:${Math.round(t.h / 2 + 2)}px;` : ''}color:#8D97A2">${esc(sub)}</span>${handles}</div>`;
}

function vicTileHTML(t, i, overlap) {
  const d = S.dev.get(t.key);
  const small = t.h < 96, big = t.h >= 170 && t.w >= 220;
  const isz = small ? 24 : big ? 44 : 32;
  const sio = isSioKey(t.key);
  const v = sio ? sioText(d) : vicText(d, small, big);
  if (sio && small && d && d.sio === 'switch') v.sub = '';
  const name = d ? labelOf(d) : (S.layout.names[t.key] || (sio ? T('Sensor') : 'Victron'));
  const cls = ['tile', 'gas', small && 'small', big && 'big', i === S.sel && 'sel', overlap && 'overlap'].filter(Boolean).join(' ');
  const handles = i === S.sel ? ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(hh => `<span class="hd" data-h="${hh}"></span>`).join('') : '';
  const subRight = small ? 84 : big ? 18 : 14;
  return `<div class="${cls}" data-i="${i}" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:#181D22;border-color:#272E36;opacity:${d && !v.stale ? 1 : .5}">
    <span class="tclip">${v.fill != null ? `<span class="tfill" style="height:${Math.round(t.h * v.fill / 100)}px;background:${css(v.accent)}"></span>` : ''}</span>
    <span class="ti" style="color:${css(v.accent)}">${icon(d ? autoIcon(d) : 'bluetooth', isz)}</span>
    <span class="tp" style="color:${v.fill != null && v.fill < 15 ? '#FF6A5C' : '#E9EDF1'}">${esc(v.value)}</span>
    <span class="tn" data-notr style="${small ? `top:${Math.round(t.h / 2 - 24)}px;` : ''}color:#E9EDF1">${esc(name)}</span>
    <span class="ts" style="${small ? `top:${Math.round(t.h / 2 + 2)}px;` : ''}right:${subRight}px;overflow:hidden;text-overflow:ellipsis;color:#8D97A2">${esc(v.sub)}</span>${handles}</div>`;
}

function tileHTML(t, i, overlap) {
  if (isGasKey(t.key)) return gasTileHTML(t, i, overlap);
  if (isHeatKey(t.key)) return heatTileHTML(t, i, overlap);
  if (isVicKey(t.key) || isSioKey(t.key)) return vicTileHTML(t, i, overlap);
  const v = visual(t);
  const isz = v.small ? 24 : v.big ? 44 : 32;
  const cls = ['tile', v.small && 'small', v.big && 'big', i === S.sel && 'sel', overlap && 'overlap'].filter(Boolean).join(' ');
  let style = `left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:${v.bg};border-color:${v.border};opacity:${v.opacity}`;
  const nameStyle = v.small ? `top:${Math.round(t.h / 2 - 24)}px;` : '';
  const subStyle = v.small ? `top:${Math.round(t.h / 2 + 2)}px;` : '';
  const bar = v.bar != null ? `<span class="tb" style="background:${css(v.fg, .2)}"><span style="width:${Math.max(4, Math.round((t.w - 28) * v.bar / 100))}px;background:${css(v.fg, .8)}"></span></span>` : '';
  const handles = i === S.sel ? ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(hh => `<span class="hd" data-h="${hh}"></span>`).join('') : '';
  return `<div class="${cls}" data-i="${i}" style="${style}">
    <span class="ti" style="color:${css(v.ic)}">${icon(tileIcon(t), isz)}</span>
    <span class="tn" data-notr style="${nameStyle}color:${css(v.fg)}">${esc(v.name)}</span>
    <span class="ts" style="${subStyle}color:${css(v.fg2)}">${esc(v.sub)}</span>${bar}${handles}</div>`;
}

// ------------------------------------------------------------------ Rendern
function renderAll(opts = {}) {
  renderTop();
  renderList();
  renderCanvas();
  if (!opts.keepInspector) renderInspector();
}

function renderTop() {
  const st = $('#status');
  if (S.demo) {
    st.innerHTML = `<span class="demo-banner">Demo</span><span>Kein Panel erreichbar – Änderungen werden nicht gespeichert.</span>`;
  } else if (S.info) {
    const m = S.info.mqtt || {};
    const ok = m.connected && m.bridge !== false;
    const cls = m.connected ? (m.bridge ? 'ok' : 'warn') : 'bad';
    const txt = m.connected ? (m.bridge ? `Zigbee2MQTT verbunden, ${S.devices.length} schaltbare Geräte` : 'Broker verbunden, Zigbee2MQTT meldet sich nicht')
      : (m.status || 'Keine Verbindung zum MQTT-Broker');
    const net = S.info.net || {};
    const mode = MODE_INFO[net.mode || 0].t;
    st.innerHTML = `<span class="dot ${cls}"></span><span>${esc(txt)}</span><span style="color:var(--faint)">${esc(mode)}-Modus${net.ap_active ? ', Panel-WLAN ' + esc(net.ap_ssid) : ''}</span>`;
    void ok;
  }
  const save = $('#btnSave');
  save.innerHTML = icon('save', 18) + (S.dirty ? 'Speichern' : 'Gespeichert');
  save.disabled = !S.dirty;
  const u = $('#btnUndo');
  u.innerHTML = icon('undo', 18) + 'Rückgängig';
  u.disabled = !S.undo.length;
  $('#btnSettings').innerHTML = icon('gear', 18) + 'Einstellungen';
}

function devSwatch(d) {
  const st = d.state || {};
  if (d.kind === 'gas') {
    const c = st.level != null ? gasColor(st.level) : null;
    return `<span class="sw" style="background:#181D22;border-color:#272E36;color:${c ? css(c) : '#9AA5B1'}">${icon('gas', 20)}</span>`;
  }
  if (d.kind === 'heat') {
    const c = st.error ? '#FF6A5C' : st.running ? '#F3A43B' : '#9AA5B1';
    return `<span class="sw" style="background:#181D22;border-color:#272E36;color:${c}">${icon('flame', 20)}</span>`;
  }
  if (d.kind === 'satio') {
    const v = sioText(d);
    return `<span class="sw" style="background:#181D22;border-color:#272E36;color:${css(v.accent)}">${icon(autoIcon(d), 20)}</span>`;
  }
  if (d.kind === 'victron') {
    const v = vicText(d, false, false);
    return `<span class="sw" style="background:#181D22;border-color:#272E36;color:${css(v.accent)}">${icon(autoIcon(d), 20)}</span>`;
  }
  const on = d.online !== false && st.on;
  if (on) {
    const c = displayColor(d);
    const fg = lvBright(c) > 150 ? '#1E1206' : '#fff';
    return `<span class="sw" style="background:${css(c)};color:${fg}">${icon(autoIcon(d), 20)}</span>`;
  }
  return `<span class="sw" style="background:#181D22;border-color:#272E36;color:#9AA5B1">${icon(autoIcon(d), 20)}</span>`;
}

function renderList() {
  const box = $('#devList');
  const pl = placements();
  const f = S.filter.trim().toLowerCase();
  const devs = sortedDevices().filter(d => !f || (labelOf(d) + ' ' + d.name + ' ' + (d.model || '') + ' ' + (d.vendor || '')).toLowerCase().includes(f));
  $('#devCount').textContent = S.devices.length ? S.devices.length : '';
  const caps = d => T(d.kind === 'gas' ? 'Gasflasche' : d.kind === 'heat' ? 'Heizung' : d.kind === 'victron' ? (VIC_KIND[d.vtype] || 'Victron') : d.kind === 'satio' ? (SIO_KIND[d.sio] || 'Sensor') : '') || [T(d.kind === 'switch' ? 'Schalter' : (d.color ? 'Farbe' : d.ct ? 'Weißtöne' : d.bri ? 'Dimmbar' : 'Ein/Aus')), d.ep && TF('Kanal {}', d.ep)].filter(Boolean).join(', ');
  const row = (d, placed) => {
    const p = pl.get(d.key);
    const gs = d.state || {};
    const second = d.kind === 'gas' ? (gs.level != null ? [`${gs.level}\u202F%`, amountText(gs)].filter(Boolean).join(', ') : (gs.status || [d.vendor, d.model].join(' ')))
      : d.kind === 'victron' ? vicSummary(d)
      : d.kind === 'satio' ? [sioText(d).value, d.sat].filter(x => x && x !== '–').join(' · ')
      : d.kind === 'heat' ? [d.vendor, d.model].join(' ') + ' – ' + (gs.has ? T('innen ') + tempText(gs.room) : (gs.status || ''))
      : labelOf(d) !== defName(d) ? defName(d) : [d.vendor, d.model].filter(Boolean).join(' ');
    return `<div class="dev ${placed ? 'placed' : ''} ${d.online === false ? 'offline' : ''}" data-key="${esc(d.key)}" tabindex="0"
      title="${placed ? 'Klicken: Kachel zeigen' : 'Auf das Panel ziehen'}">
      ${devSwatch(d)}
      <div class="tx"><div class="n" data-notr>${esc(labelOf(d))}</div><div class="m">${esc(second || caps(d))}${d.online === false ? T(' – nicht erreichbar') : ''}</div></div>
      ${placed ? `<span class="pg">${esc(S.layout.pages[p.pi].name)}</span>`
               : `<button class="btn ghost icon small add" data-add="${esc(d.key)}" aria-label="${esc(labelOf(d))} ${T('hinzufügen')}" title="Auf freien Platz setzen">${icon('plus', 16)}</button>`}
    </div>`;
  };
  const free = devs.filter(d => !pl.has(d.key)), placed = devs.filter(d => pl.has(d.key));
  let html = '';
  if (!S.devices.length) {
    const m = (S.info && S.info.mqtt) || {};
    html = `<div class="empty">${!m.connected
      ? 'Das Panel ist noch nicht mit dem MQTT-Broker verbunden. Prüfe die Einstellungen.'
      : esc(m.devlist || 'Zigbee2MQTT hat noch keine Lampen oder Schalter gemeldet.')}</div>`;
  } else {
    if (free.length) html += `<div class="group-title">Noch nicht auf dem Panel (${free.length})</div>` + free.map(d => row(d, false)).join('');
    if (placed.length) html += `<div class="group-title">Auf dem Panel (${placed.length})</div>` + placed.map(d => row(d, true)).join('');
    if (!free.length && !placed.length) html = `<div class="empty">Kein Gerät passt zu „${esc(S.filter)}“.</div>`;
  }
  box.innerHTML = html;
}

function updateScale() {
  const stage = $('#stage');
  const bar = $('.stagebar').offsetHeight;
  const availW = stage.clientWidth - 48 - 32;
  const availH = stage.clientHeight - 48 - 32 - bar - 14;
  const s = Math.max(0.25, Math.min(availW / W, availH / H, 1.15));
  S.scale = s;
  const wrap = $('#screenwrap');
  wrap.style.width = Math.round(W * s) + 'px';
  wrap.style.height = Math.round(H * s) + 'px';
  const scr = $('#screen');
  scr.style.transform = `scale(${s})`;
  scr.style.setProperty('--inv', (1 / s).toFixed(3));
}

function renderCanvas() {
  const pg = page();
  // Hintergrund
  const bg = $('#bg');
  const bgSrc = S.demo ? S.demoBg[pg.id] : (pg.bg ? `/api/bg?page=${encodeURIComponent(pg.id)}&v=${S.bgVer[pg.id] || 0}` : null);
  if (bgSrc) { if (bg.getAttribute('src') !== bgSrc) bg.src = bgSrc; bg.style.display = 'block'; }
  else { bg.removeAttribute('src'); bg.style.display = 'none'; }
  // Statusleiste wie am Panel
  const pbar = $('#pbar');
  pbar.classList.toggle('trans', !!bgSrc);
  const n = S.layout.pages.length;
  const now = new Date();
  const clock = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  pbar.innerHTML = `<div class="ptabs">${S.layout.pages.map((p, i) =>
      `<div class="ptab ${n === 1 ? 'single' : ''} ${i === S.page ? 'act' : ''}" data-page="${i}" title="Doppelklick: umbenennen">${esc(p.name)}</div>`).join('')}
      ${n < 8 ? `<div class="ptab addpage" data-addpage title="Neue Seite (nur im Editor sichtbar)">${icon('plus', 20)}</div>` : ''}</div>
    <div class="pstat">${icon('link', 24)}${icon('wifi', 24)}<span class="clock">${clock}</span></div>
    <div class="pgear">${icon('gear', 24)}</div>`;
  // Kacheln
  const c = $('#content');
  const g = S.layout.grid;
  c.style.setProperty('--g', g + 'px');
  c.classList.toggle('gridon', !!S.drag && g > 1);
  const ov = new Set();
  pg.tiles.forEach((a, i) => pg.tiles.forEach((b, j) => { if (i < j && overlaps(a, b)) { ov.add(i); ov.add(j); } }));
  let html = pg.tiles.map((t, i) => tileHTML(t, i, ov.has(i))).join('');
  if (!pg.tiles.length) html += `<div class="emptyhint">Diese Seite ist leer.<br>Ziehe Geräte aus der Liste hierher.</div>`;
  html += `<div class="drop" id="drop"></div>`;
  c.innerHTML = html;
}

function capChips(d) {
  const st = d.state || {};
  const chips = [['Ein/Aus', true], ['Helligkeit', d.bri], ['Weißtöne', !!d.ct], ['Farbe', !!d.color]]
    .filter(c => c[1]).map(c => `<span class="chip">${c[0]}</span>`);
  if (d.ep) chips.push(`<span class="chip">Kanal ${esc(d.ep)}</span>`);
  if (d.online === false) chips.push('<span class="chip">nicht erreichbar</span>');
  else if (st.on) chips.push('<span class="chip on">gerade an</span>');
  return chips.join('');
}

function renderInspector() {
  const el = $('#insp');
  const pg = page();
  const t = pg.tiles[S.sel];
  if (!t) { renderPageInspector(el, pg); return; }
  const d = S.dev.get(t.key);
  const name = tileLabel(t);
  const preset = PRESETS.findIndex(p => p.w === t.w && p.h === t.h);
  if (isVicKey(t.key) || isSioKey(t.key)) {
    const gx = t.key.startsWith('cerbo:');
    const sio = isSioKey(t.key);
    el.innerHTML = `
    <div class="sec">
      <h2 data-notr>${esc(name)}</h2>
      <p class="sub">${sio ? esc(T(d ? (SIO_KIND[d.sio] || 'Sensor') : 'Sensor')) + ', ' + esc(t.key.slice(6))
        : esc(d ? T(VIC_KIND[d.vtype] || 'Victron') : 'Victron') + ', ' + esc(gx ? 'Cerbo GX' : t.key.slice(8))}</p>
      ${d ? (sio ? sioReadout(d) : vicReadout(d)) + (d.state && d.state.status && d.state.status !== 'OK' ? `<p class="hint">${esc(d.state.status)}</p>` : '')
          : `<div class="warn">${sio ? T('Der Satellit meldet diesen Anschluss gerade nicht. Belegung in der Weboberfläche des Satelliten prüfen.')
            : gx ? T('Der Cerbo GX ist am Panel nicht eingerichtet (Einstellungen → Victron) oder in der Firmware ausgeschaltet.') : T('Dieses Victron-Gerät ist am Panel nicht mehr eingerichtet.')}</div>`}
      ${sio && d && d.sio === 'switch' ? `<button class="btn small" id="bSioToggle" style="margin-top:10px">${T(d.state && d.state.on ? 'Ausschalten' : 'Einschalten')}</button>` : ''}
    </div>
    <div class="sec">
      <h3>Name auf dem Panel</h3>
      <label class="field"><input id="fLabel" value="${esc((S.layout.names[t.key] || '').trim())}" placeholder="${esc(d ? defName(d) : (sio ? T('Sensor') : 'Victron'))}" maxlength="48"></label>

function bindTileInspector(t, d) {
  const lab = $('#fLabel');
  let snap = null;
  lab.onfocus = () => { snap = JSON.stringify(S.layout); };
  lab.oninput = () => {
    if (snap) { pushUndo(snap); snap = null; }
    const v = lab.value.trim();
    if (!v || (d && v === defName(d))) delete S.layout.names[t.key]; else S.layout.names[t.key] = v;
    S.dirty = true;
    renderTop(); renderCanvas(); renderList();
    $('#insp h2').textContent = tileLabel(t);
  };
  if ($('#bZ2m')) $('#bZ2m').onclick = async () => {
    const nn = $('#fZ2m').value.trim();
    if (!nn || nn === d.name) return;
    if (/[#+]/.test(nn) || /\/\d+$/.test(nn)) { toast('Zigbee2MQTT erlaubt # und + nicht und keinen Namen, der auf /Zahl endet.', 'error'); return; }
    if (!await confirmDlg('In Zigbee2MQTT umbenennen?', `„${d.name}“ heißt danach überall „${nn}“ – auch in Home Assistant.`, 'Umbenennen')) return;
    if (S.demo) { S.devices.filter(x => x.ieee === d.ieee).forEach(x => { x.name = nn; }); setDevices(S.devices); renderAll(); toast('Demo: umbenannt.'); return; }
    try { await post('/api/rename', {ieee: d.ieee, name: nn}); toast('An Zigbee2MQTT gesendet. Der neue Name erscheint gleich.'); setTimeout(pollDevices, 1500); }
    catch (e) { toast(e.message, 'error'); }
  };
  if ($('#icons')) $('#icons').onclick = e => {
    const b = e.target.closest('button[data-icon]');
    if (!b) return;
    change(() => { if (b.dataset.icon) t.icon = b.dataset.icon; else delete t.icon; });
  };
  $('#presets').onclick = e => {
    const b = e.target.closest('button[data-preset]');
    if (!b) return;
    const p = PRESETS[+b.dataset.preset];
    change(() => { t.w = p.w; t.h = p.h; t.x = clamp(t.x, 0, W - t.w); t.y = clamp(t.y, 0, CH - t.h); });
  };
  document.querySelectorAll('#insp input[data-k]').forEach(inp => {
    inp.onchange = () => {
      const k = inp.dataset.k;
      let v = parseInt(inp.value, 10);
      if (isNaN(v)) return;
      change(() => {
        if (k === 'w') t.w = clamp(v, 72, W);
        if (k === 'h') t.h = clamp(v, 56, CH);
        t.x = clamp(k === 'x' ? v : t.x, 0, W - t.w);
        t.y = clamp(k === 'y' ? v : t.y, 0, CH - t.h);
      });
    };
  });
  $('#bMove').onclick = () => {
    const to = +$('#fMove').value;
    if (to === S.page) return;
    change(() => {
      const [tile] = page().tiles.splice(S.sel, 1);
      const dst = S.layout.pages[to];
      const slot = freeSlot(dst, tile.w, tile.h);
      if (slot) { tile.x = slot.x; tile.y = slot.y; }
      dst.tiles.push(tile);
      S.page = to;
      S.sel = dst.tiles.length - 1;
    });
  };
  $('#bRemove').onclick = () => removeSelected();
}

function removeSelected() {
  if (S.sel < 0) return;
  change(() => { page().tiles.splice(S.sel, 1); S.sel = -1; });
}

// ------------------------------------------------------------------ Ziehen & Groesse aendern
function toContent(e) {
  const r = $('#content').getBoundingClientRect();
  return {x: (e.clientX - r.left) / S.scale, y: (e.clientY - r.top) / S.scale, inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom};
}
function snapRect(rect, mode, hnd, others, free) {
  const g = S.layout.grid, th = 8;
  const guides = [];
  if (free) return {rect, guides};
  const xs = [], ys = [];
  for (const o of others) {
    xs.push(o.x, o.x + o.w, o.x + o.w + GAP, o.x - GAP);
    ys.push(o.y, o.y + o.h, o.y + o.h + GAP, o.y - GAP);
  }
  xs.push(W / 2); ys.push(CH / 2);
  const best = (vals, list) => {
    let b = null;
    for (const v of vals) for (const c of list) { const dd = Math.abs(v.val - c); if (dd <= th && (!b || dd < b.d)) b = {d: dd, delta: c - v.val, at: c}; }
    return b;
  };
  const gridSnap = v => g > 1 ? Math.round(v / g) * g : Math.round(v);
  if (mode === 'move') {
    const bx = best([{val: rect.x}, {val: rect.x + rect.w}, {val: rect.x + rect.w / 2}], xs);
    const by = best([{val: rect.y}, {val: rect.y + rect.h}, {val: rect.y + rect.h / 2}], ys);
    if (bx) { rect.x += bx.delta; guides.push({v: true, at: bx.at}); } else rect.x = gridSnap(rect.x);
    if (by) { rect.y += by.delta; guides.push({v: false, at: by.at}); } else rect.y = gridSnap(rect.y);
  } else {
    if (hnd.includes('e')) { const r = rect.x + rect.w; const b = best([{val: r}], xs); const nr = b ? b.at : gridSnap(r); rect.w = nr - rect.x; if (b) guides.push({v: true, at: b.at}); }
    if (hnd.includes('w')) { const b = best([{val: rect.x}], xs); const nl = b ? b.at : gridSnap(rect.x); rect.w += rect.x - nl; rect.x = nl; if (b) guides.push({v: true, at: b.at}); }
    if (hnd.includes('s')) { const bt = rect.y + rect.h; const b = best([{val: bt}], ys); const nb = b ? b.at : gridSnap(bt); rect.h = nb - rect.y; if (b) guides.push({v: false, at: b.at}); }
    if (hnd.includes('n')) { const b = best([{val: rect.y}], ys); const nt = b ? b.at : gridSnap(rect.y); rect.h += rect.y - nt; rect.y = nt; if (b) guides.push({v: false, at: b.at}); }
  }
  return {rect, guides};
}
function drawGuides(guides, rect) {
  const c = $('#content');
  c.querySelectorAll('.guide,.sizetag').forEach(x => x.remove());
  for (const gd of guides) {
    const el = document.createElement('div');
    el.className = 'guide ' + (gd.v ? 'v' : 'h');
    el.style[gd.v ? 'left' : 'top'] = gd.at + 'px';
    c.appendChild(el);
  }
  if (rect) {
    const tag = document.createElement('div');
    tag.className = 'sizetag';
    tag.textContent = `${rect.w} × ${rect.h}`;
    tag.style.left = rect.x + 'px';
    tag.style.top = Math.max(0, rect.y - 26 / S.scale) + 'px';
    c.appendChild(tag);
  }
}

function onContentDown(e) {
  if (e.button !== 0) return;
  const tEl = e.target.closest('.tile');
  if (!tEl) {
    if (S.sel !== -1) { S.sel = -1; renderCanvas(); renderInspector(); }
    return;
  }
  const i = +tEl.dataset.i;
  const hnd = e.target.dataset.h || null;
  if (S.sel !== i) { S.sel = i; renderCanvas(); renderInspector(); }
  const t = page().tiles[i];
  S.drag = {i, mode: hnd ? 'resize' : 'move', hnd, sx: e.clientX, sy: e.clientY, orig: {...t}, snap: JSON.stringify(S.layout), moved: false};
  $('#content').setPointerCapture(e.pointerId);
  e.preventDefault();
}
function onContentMove(e) {
  const d = S.drag;
  if (!d) return;
  const dx = (e.clientX - d.sx) / S.scale, dy = (e.clientY - d.sy) / S.scale;
  if (!d.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  if (!d.moved) { d.moved = true; $('#content').classList.toggle('gridon', S.layout.grid > 1); }
  const o = d.orig;
  let rect = {x: o.x, y: o.y, w: o.w, h: o.h};
  if (d.mode === 'move') { rect.x = o.x + dx; rect.y = o.y + dy; }
  else {
    if (d.hnd.includes('e')) rect.w = o.w + dx;
    if (d.hnd.includes('s')) rect.h = o.h + dy;
    if (d.hnd.includes('w')) { rect.x = o.x + dx; rect.w = o.w - dx; }
    if (d.hnd.includes('n')) { rect.y = o.y + dy; rect.h = o.h - dy; }
  }
  const others = page().tiles.filter((_, j) => j !== d.i);
  const res = snapRect(rect, d.mode, d.hnd || '', others, e.altKey);
  rect = res.rect;
  // Grenzen
  if (d.mode === 'move') { rect.x = clamp(Math.round(rect.x), 0, W - rect.w); rect.y = clamp(Math.round(rect.y), 0, CH - rect.h); }
  else {
    rect.w = Math.round(rect.w); rect.h = Math.round(rect.h); rect.x = Math.round(rect.x); rect.y = Math.round(rect.y);
    if (rect.x < 0) { rect.w += rect.x; rect.x = 0; }
    if (rect.y < 0) { rect.h += rect.y; rect.y = 0; }
    rect.w = clamp(rect.w, 72, W - rect.x);
    rect.h = clamp(rect.h, 56, CH - rect.y);
    if (d.hnd.includes('w')) rect.x = o.x + o.w - rect.w;
    if (d.hnd.includes('n')) rect.y = o.y + o.h - rect.h;
  }
  const t = page().tiles[d.i];
  Object.assign(t, rect);
  const el = $(`#content .tile[data-i="${d.i}"]`);
  if (d.mode === 'resize') {
    // Inhalt (klein/gross) kann sich aendern -> Kachel neu zeichnen
    el.outerHTML = tileHTML(t, d.i, false);
    $(`#content .tile[data-i="${d.i}"]`).classList.add('dragging');
  } else {
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    el.classList.add('dragging');
  }
  drawGuides(res.guides, rect);
}
function onContentUp() {
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  if (d.moved) {
    pushUndo(d.snap);
    S.dirty = true;
  }
  renderAll();
}

// Neue Kachel aus der Liste ziehen
function onListDown(e) {
  if (e.button !== 0 || e.target.closest('button')) return;
  const row = e.target.closest('.dev');
  if (!row) return;
  S.newDrag = {key: row.dataset.key, sx: e.clientX, sy: e.clientY, started: false, row, ghost: null};
  row.setPointerCapture(e.pointerId);
}
function onListMove(e) {
  const d = S.newDrag;
  if (!d) return;
  if (!d.started) {
    if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) < 5) return;
    d.started = true;
    d.ghost = document.createElement('div');
    d.ghost.className = 'ghost-drag';
    const dev = S.dev.get(d.key);
    d.ghost.textContent = dev ? labelOf(dev) : '';
    document.body.appendChild(d.ghost);
    if (S.sel !== -1) { S.sel = -1; renderCanvas(); renderInspector(); }
  }
  d.ghost.style.left = e.clientX + 'px';
  d.ghost.style.top = e.clientY + 'px';
  const p = toContent(e);
  const drop = $('#drop');
  if (p.inside) {
    const g = S.layout.grid > 1 ? S.layout.grid : 1;
    let x = Math.round((p.x - DEF_W / 2) / g) * g, y = Math.round((p.y - DEF_H / 2) / g) * g;
    x = clamp(x, 0, W - DEF_W); y = clamp(y, 0, CH - DEF_H);
    d.at = {x, y};
    Object.assign(drop.style, {display: 'block', left: x + 'px', top: y + 'px', width: DEF_W + 'px', height: DEF_H + 'px'});
  } else { d.at = null; drop.style.display = 'none'; }
}
function onListUp() {
  const d = S.newDrag;
  if (!d) return;
  S.newDrag = null;
  if (d.ghost) d.ghost.remove();
  const drop = $('#drop');
  if (drop) drop.style.display = 'none';
  if (!d.started) { focusDevice(d.key); return; }

function openBgDialog(pg) {
  const body = document.createElement('div');
  body.innerHTML = `
    <label class="field"><span>Bild (Foto, Grundriss, Screenshot)</span><input type="file" id="bgFile" accept="image/*"></label>
    <canvas class="bgprev" id="bgCanvas" width="1024" height="600"></canvas>
    <label class="field" style="margin-top:12px"><span>Abdunkeln: <b id="bgDimV" class="num">35 %</b></span><input type="range" id="bgDim" min="0" max="80" value="35"></label>
    <p class="hint">Das Bild wird auf 1024 × 600 Pixel zugeschnitten. Abdunkeln hält die Kacheln lesbar.</p>`;
  let img = null;
  const draw = () => {
    const cv = $('#bgCanvas', body), ctx = cv.getContext('2d');
    ctx.fillStyle = '#0F1215';
    ctx.fillRect(0, 0, W, H);
    if (!img) return;
    const s = Math.max(W / img.width, H / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    const dim = +$('#bgDim', body).value / 100;
    ctx.fillStyle = `rgba(0,0,0,${dim})`;
    ctx.fillRect(0, 0, W, H);
  };
  $('#bgFile', body).onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const im = new Image();
    im.onload = () => { img = im; draw(); };
    im.onerror = () => toast('Dieses Bild kann der Browser nicht lesen.', 'error');
    im.src = URL.createObjectURL(f);
  };
  $('#bgDim', body).oninput = e => { $('#bgDimV', body).textContent = e.target.value + ' %'; draw(); };
  modal({title: `Hintergrund für „${pg.name}“`, body, wide: true, actions: [
    {label: 'Abbrechen', kind: 'ghost'},
    {label: 'Hintergrund übernehmen', kind: 'primary', onClick: async (close, btn) => {
      if (!img) { toast('Bitte zuerst ein Bild wählen.'); return; }
      btn.disabled = true;
      btn.textContent = 'Wird übertragen …';
      try { await uploadBg(pg, $('#bgCanvas', body)); close(); toast('Hintergrund ist auf dem Panel.'); }
      catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Hintergrund übernehmen'; }
    }}]});
}
async function uploadBg(pg, cv) {
  if (S.demo) { S.demoBg[pg.id] = cv.toDataURL('image/jpeg', 0.85); pg.bg = true; renderAll(); return; }
  // Das Panel dekodiert das JPEG selbst; es liegt auf der SD-Karte (falls gesteckt) oder im Flash
  let jpg = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
  if (jpg.size > 1900 * 1024) jpg = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.75));
  await api(`/api/bg?page=${encodeURIComponent(pg.id)}&fmt=jpg`, {method: 'POST', headers: {'Content-Type': 'image/jpeg'}, body: jpg});
  pg.bg = true;
  S.bgVer[pg.id] = (S.bgVer[pg.id] || 0) + 1;
  renderAll();
}
async function removeBg(pg) {
  if (!await confirmDlg('Hintergrund entfernen?', 'Das Bild wird sofort vom Panel gelöscht.', 'Entfernen', true)) return;
  if (S.demo) { delete S.demoBg[pg.id]; pg.bg = false; renderAll(); return; }
  try { await api(`/api/bg?page=${encodeURIComponent(pg.id)}&delete=1`, {method: 'POST'}); pg.bg = false; renderAll(); }
  catch (e) { toast(e.message, 'error'); }

async function save(force = false) {
  if (!S.dirty && !force) return;
  if (S.demo) { toast('Demo: Hier wird nichts gespeichert. Öffne den Editor über die Adresse des Panels.'); return; }
  try {
    const r = await post('/api/layout' + (force ? '?force=1' : ''), S.layout);
    S.layout.rev = r.rev;
    S.dirty = false;
    renderTop();
    toast('Gespeichert. Das Panel zeigt jetzt dieses Layout.');
  } catch (e) {
    if (e.status === 409) {
      modal({title: 'Am Panel wurde etwas geändert', body: '<p style="color:var(--muted);margin:4px 0">Seit du den Editor geöffnet hast, wurde am Panel selbst etwas angepasst – zum Beispiel ein Name. Du kannst deine Version trotzdem speichern oder den Stand vom Panel laden.</p>',
        actions: [{label: 'Stand vom Panel laden', kind: 'ghost', onClick: async c => { c(); await reloadLayout(); }},
          {label: 'Meine Version speichern', kind: 'primary', onClick: c => { c(); save(true); }}]});
    } else toast(e.message, 'error');
  }
}
async function reloadLayout() {
  S.layout = normLayout(await api('/api/layout'));

const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

// Animierte Vorschau des Ruhezustands im Einstellungsdialog (halbe Groesse des Panels)
function startSaverPreview(body, draft) {
  const st = {x: 60, y: 40, vx: 1.3, vy: 1.0, col: 0, flash: 0, cx: 40, cy: 40, moved: 0, img: null, imgUrl: null, tinted: null, tintCol: null, iconImg: null};
  const icn = new Image();
  icn.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 256 256" fill="#fff">${ICON_PATHS.bulb}</svg>`);
  st.iconImg = icn;
  const timeStr = () => { const n = new Date(); return `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`; };
  const tint = (img, col) => {
    if (st.tinted && st.tintCol === col) return st.tinted;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = col;
    x.fillRect(0, 0, c.width, c.height);
    st.tinted = c; st.tintCol = col;
    return c;
  };
  const frame = () => {
    if (!body.isConnected) return;
    const cv = $('#saverPrev', body);
    if (!cv) { requestAnimationFrame(frame); return; }
    const ctx = cv.getContext('2d'), Wp = cv.width, Hp = cv.height, dd = draft.display, sv = dd.saver ?? 1;
    const lvl = sv === 0 ? dd.dim_level : Math.max(dd.dim_level, 6);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, Wp, Hp);
    ctx.globalAlpha = Math.min(1, 0.25 + lvl / 40);
    if (sv === 0) {
      // gedimmtes Dashboard angedeutet
      ctx.fillStyle = '#0B0D10'; ctx.fillRect(0, 0, Wp, 28);
      const cols = ['#F3A43B', '#181D22', '#3C8DFF', '#181D22', '#F3A43B'];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) {
        ctx.fillStyle = cols[(r * 5 + c) % 5];
        ctx.beginPath(); ctx.roundRect(10 + c * 100, 38 + r * 66, 92, 58, 9); ctx.fill();
      }
      if (!lvl) { ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, Wp, Hp); }
    } else if (sv === 2) {
      const n = new Date();
      ctx.font = '400 70px "Inter Panel", system-ui';
      const tw = ctx.measureText(timeStr()).width;
      if (Date.now() - st.moved > 2500) { st.cx = 8 + Math.random() * (Wp - tw - 16); st.cy = 70 + Math.random() * (Hp - 110); st.moved = Date.now(); }
      ctx.fillStyle = '#7C8794'; ctx.fillText(timeStr(), st.cx, st.cy);
      ctx.font = '600 13px "Inter Panel", system-ui'; ctx.fillStyle = '#55606B';
      ctx.fillText(`${WD[n.getDay()]}, ${n.getDate()}. ${MO[n.getMonth()]}`, st.cx + 4, st.cy + 26);
    } else if (sv === 3) {
      const col = st.flash > Date.now() ? '#FFFFFF' : SAVER_COLORS[st.col];
      let w, h;
      const logo = S.logoUrl;
      if (logo && st.imgUrl !== logo) { st.img = new Image(); st.img.src = logo; st.imgUrl = logo; st.tinted = null; }
      const useLogo = logo && st.img && st.img.complete && st.img.naturalWidth;
      if (useLogo) {
        const sc = 0.5;
        w = st.img.naturalWidth * sc; h = st.img.naturalHeight * sc;
        const src = dd.saver_recolor ? tint(st.img, col) : st.img;
        ctx.drawImage(src, st.x, st.y, w, h);
      } else {
        ctx.font = '600 20px "Inter Panel", system-ui';
        const tw = ctx.measureText(timeStr()).width;
        w = 13 + 22 + 8 + tw + 13; h = 46;
        ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(st.x + 1, st.y + 1, w - 2, h - 2, 13); ctx.stroke();
        if (icn.complete && icn.naturalWidth) {
          if (!st.iconTint || st.iconTintCol !== col) {
            const c = document.createElement('canvas'); c.width = 64; c.height = 64;
            const x = c.getContext('2d'); x.drawImage(icn, 0, 0, 64, 64);
            x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, 64, 64);
            st.iconTint = c; st.iconTintCol = col;
          }
          ctx.drawImage(st.iconTint, st.x + 13, st.y + 12, 22, 22);
        }
        ctx.fillStyle = col; ctx.fillText(timeStr(), st.x + 13 + 22 + 8, st.y + 30);
      }
      st.x += st.vx; st.y += st.vy;
      let hx = false, hy = false;
      if (st.x <= 0) { st.x = 0; st.vx = Math.abs(st.vx); hx = true; }
      if (st.x >= Wp - w) { st.x = Wp - w; st.vx = -Math.abs(st.vx); hx = true; }
      if (st.y <= 0) { st.y = 0; st.vy = Math.abs(st.vy); hy = true; }
      if (st.y >= Hp - h) { st.y = Hp - h; st.vy = -Math.abs(st.vy); hy = true; }
      if (hx || hy) {
        const nearX = st.x <= 3 || st.x >= Wp - w - 3, nearY = st.y <= 3 || st.y >= Hp - h - 3;
        if ((hx && nearY) || (hy && nearX)) st.flash = Date.now() + 700;
        st.col = (st.col + 1 + Math.floor(Math.random() * (SAVER_COLORS.length - 1))) % SAVER_COLORS.length;
        st.tinted = null;
      }
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// Eigenes Logo: auf hoechstens 320 x 200 verkleinern, als RGB565 + Alpha an das Panel schicken
async function uploadLogo(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Dieses Bild kann der Browser nicht lesen.')); i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, 320 / img.width, 200 / img.height);
  const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const out = new Uint8Array(4 + w * h * 3);
  out[0] = w & 255; out[1] = w >> 8; out[2] = h & 255; out[3] = h >> 8;
  for (let i = 0, p = 0, o = 4; i < w * h; i++, p += 4, o += 3) {
    const v = ((px[p] & 0xF8) << 8) | ((px[p + 1] & 0xFC) << 3) | (px[p + 2] >> 3);
    out[o] = v & 255; out[o + 1] = v >> 8; out[o + 2] = px[p + 3];
  }
  const png = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (S.demo) { S.logoUrl = URL.createObjectURL(png); toast('Demo: Logo nur hier übernommen.'); return; }
  await api('/api/saver_logo?fmt=bin', {method: 'POST', headers: {'Content-Type': 'application/octet-stream'}, body: out});
  await api('/api/saver_logo?fmt=png', {method: 'POST', headers: {'Content-Type': 'image/png'}, body: png});
  S.logoUrl = '/api/saver_logo?v=' + Date.now();
  toast(`Logo ist auf dem Panel (${w} × ${h} Pixel).`);
}

function runOta() {

  if (S.demo) { toast('Demo: kein Update möglich.'); return; }

  };
  xhr.onerror = () => toast('Verbindung beim Update abgebrochen.', 'error');
  xhr.send(f);
}

      {key: 'victron:c4:5e:11:aa:bb:01', x: 420, y: 280, w: 184, h: 116}, {key: 'victron:c4:5e:11:aa:bb:02', x: 620, y: 280, w: 184, h: 116}]},

  S.info = {fw: '1.0.0', ip: '192.168.1.50', net: {mode: 0, status: 'Demo'}, mqtt: {connected: true, bridge: true, status: 'Demo'}, devices: list.length, uptime: 7380, heap: 120000, psram: 5200000, touch: 'GT911 @0x5D, 1024x600'};

async function init() {
  $('#searchIcon').outerHTML = icon('search', 16);
  try { S.info = await api('/api/info'); } catch (e) { S.demo = true; }
  // Sprache: ?lang=xx im Link hat Vorrang, sonst die des Panels
  const urlLang = new URLSearchParams(location.search).get('lang');
  if (!urlLang && S.info && S.info.lang) setLang(S.info.lang);
  if (S.demo) loadDemo();
  else {
    try {
      const [devs, lay] = await Promise.all([api('/api/devices'), api('/api/layout')]);
      setDevices(devs.devices);
      S.layout = normLayout(lay);
      if (S.info && !S.info.time_valid) post('/api/time', {epoch: Math.floor(Date.now() / 1000)}).catch(() => {});
    } catch (e) { loadDemo(); toast('Das Panel antwortet unvollständig – Demo-Daten werden gezeigt.', 'error'); }
  }
  $('#gridSel').value = String(S.layout.grid);
  updateScale();
  renderAll();
  new ResizeObserver(() => updateScale()).observe($('#stage'));
  setInterval(pollDevices, 4000);
  setInterval(pollInfo, 10000);
  setInterval(() => { if (!S.drag) { const c = $('.pstat .clock'); if (c) { const n = new Date(); c.textContent = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`; } } }, 15000);
}

// ------------------------------------------------------------------ Ereignisse
$('#content').addEventListener('pointerdown', onContentDown);
$('#content').addEventListener('pointermove', onContentMove);
$('#content').addEventListener('pointerup', onContentUp);
$('#content').addEventListener('pointercancel', onContentUp);
$('#devList').addEventListener('pointerdown', onListDown);
$('#devList').addEventListener('pointermove', onListMove);
$('#devList').addEventListener('pointerup', onListUp);
$('#devList').addEventListener('pointercancel', () => { if (S.newDrag && S.newDrag.ghost) S.newDrag.ghost.remove(); S.newDrag = null; });
$('#devList').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) addToFreeSlot(b.dataset.add); });
$('#devList').addEventListener('keydown', e => {
  const row = e.target.closest('.dev');
  if (!row || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  if (placements().has(row.dataset.key)) focusDevice(row.dataset.key); else addToFreeSlot(row.dataset.key);
});
$('#pbar').addEventListener('click', onBarClick);
$('#pbar').addEventListener('dblclick', onBarDbl);
$('#search').addEventListener('input', e => { S.filter = e.target.value; renderList(); });
$('#btnSave').onclick = () => save();
$('#btnUndo').onclick = () => undo();
$('#btnSettings').onclick = () => openSettings();
$('#gridSel').onchange = e => change(() => { S.layout.grid = +e.target.value; }, {keepInspector: true});
window.addEventListener('beforeunload', e => { if (S.dirty && !S.demo) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => {
  if (document.querySelector('.scrim')) return;
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  const t = page() && page().tiles[S.sel];
  if (!t) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); return; }
  if (e.key === 'Escape') { S.sel = -1; renderCanvas(); renderInspector(); return; }
  const step = e.altKey ? 1 : (S.layout.grid > 1 ? S.layout.grid : 1) * (e.shiftKey ? 4 : 1);
  const mv = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step]}[e.key];
  if (mv) {
    e.preventDefault();
    change(() => { t.x = clamp(t.x + mv[0], 0, W - t.w); t.y = clamp(t.y + mv[1], 0, CH - t.h); });
  }
});
init();
</script>

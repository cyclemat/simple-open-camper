<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2048px;height:768px;overflow:hidden;background:#04070d}
.stage{position:relative;width:2048px;height:768px;overflow:hidden;
  background:
   radial-gradient(ellipse 520px 360px at 1700px 700px, rgba(255,140,30,.22), transparent 70%),
   radial-gradient(ellipse 700px 420px at 1250px 380px, rgba(30,120,255,.16), transparent 70%),
   radial-gradient(ellipse 600px 500px at 300px 300px, rgba(255,120,20,.18), transparent 70%),
   linear-gradient(180deg,#050912 0%,#070c18 55%,#03050a 100%);}
/* Sternenstaub */
.dust{position:absolute;inset:0}
/* Logo links aus dem CycleMat-Banner */
.cm{position:absolute;left:0;top:0;width:745px;height:768px;
  -webkit-mask-image:linear-gradient(90deg,#000 78%,transparent 100%)}
/* Kachel */
.tile{position:absolute;left:457px;top:405px;width:322px;height:285px;border-radius:34px;
  background:linear-gradient(160deg,#4fb2ff 0%,#1f8cff 45%,#0a62d6 100%);
  box-shadow:0 0 40px rgba(60,160,255,.85),0 0 90px rgba(30,120,255,.55),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 18px rgba(0,40,120,.45);
  display:flex;align-items:center;justify-content:center}
.tile svg{width:230px}
.tile.refl{top:700px;height:120px;opacity:.22;transform:scaleY(-1);transform-origin:top;
  -webkit-mask-image:linear-gradient(0deg,transparent 0%,#000 100%);box-shadow:none}
.refl2{position:absolute;left:457px;top:694px;width:322px;height:74px;border-radius:0 0 34px 34px;background:linear-gradient(180deg,rgba(40,140,255,.35),rgba(40,140,255,0))}
.floor{position:absolute;left:0;right:0;top:690px;bottom:0;
  background:linear-gradient(180deg,rgba(4,7,13,.0),rgba(4,7,13,.75))}
/* Titel */
.title{position:absolute;left:830px;top:118px;font-family:"Segoe UI Black","Arial Black",sans-serif;line-height:.92}
.t1{font-size:112px;letter-spacing:-2px;
  background:linear-gradient(180deg,#ffffff 0%,#dfe7f2 38%,#8f9db0 52%,#e9eef5 70%,#aab6c6 100%);
  -webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(120,180,255,.55)) drop-shadow(0 4px 2px rgba(0,0,0,.8))}
.t2{font-size:118px;letter-spacing:-2px;
  background:linear-gradient(180deg,#fff3c4 0%,#ffc23a 40%,#ff8a00 62%,#ffcf6a 100%);
  -webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,140,20,.7)) drop-shadow(0 4px 2px rgba(0,0,0,.8))}
.soc{margin-top:26px;font-family:"Segoe UI Semibold","Segoe UI",sans-serif;font-size:40px;letter-spacing:9px;color:#9fd2ff;
  text-shadow:0 0 14px rgba(60,160,255,.9)}
.soc b{color:#ffb238;text-shadow:0 0 14px rgba(255,140,20,.9);font-weight:700}
.sub{margin-top:18px;font-family:"Segoe UI",sans-serif;font-size:27px;color:#c9d6e6;letter-spacing:1px;opacity:.9}
/* Leiterbahnen */
.traces{position:absolute;inset:0}
/* Panel */
.panelwrap{position:absolute;left:1600px;top:170px;width:410px;height:265px;perspective:1100px}
.panel{width:100%;height:100%;transform:rotateY(-24deg) rotateX(6deg);transform-origin:left center;
  border-radius:20px;background:linear-gradient(160deg,#2a2f38,#0d1015);padding:16px;
  box-shadow:0 0 0 3px #3a414d,0 0 50px rgba(60,150,255,.55),0 30px 60px rgba(0,0,0,.8)}
.screen{width:100%;height:100%;border-radius:8px;background:linear-gradient(160deg,#0b1424,#060a12);
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:12px;
  box-shadow:inset 0 0 30px rgba(40,120,255,.35)}
.k{border-radius:10px;background:linear-gradient(160deg,#1b2a44,#121c2e);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.k svg{width:34px;height:34px}
.k.on{background:linear-gradient(160deg,#ffb238,#ff7a00);box-shadow:0 0 18px rgba(255,140,20,.8)}
.k.blue{background:linear-gradient(160deg,#3aa2ff,#0a62d6);box-shadow:0 0 18px rgba(60,160,255,.8)}
.bar{width:60%;height:7px;border-radius:4px;background:#22324d;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#29c2ff,#7fe0ff);box-shadow:0 0 8px #29c2ff}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(255,150,40,.75);
  box-shadow:0 0 18px rgba(255,140,20,.8),inset 0 0 18px rgba(255,140,20,.5)}
.ring.b{border-color:rgba(60,160,255,.6);box-shadow:0 0 18px rgba(60,160,255,.7)}
/* Satelliten */
.sat{position:absolute;width:118px;height:64px;border-radius:12px;background:linear-gradient(160deg,#2b3038,#101318);
  box-shadow:0 0 0 2px #3a414d,0 10px 24px rgba(0,0,0,.7)}
.sat::after{content:"";position:absolute;right:12px;bottom:12px;width:9px;height:9px;border-radius:50%;
  background:#3aa2ff;box-shadow:0 0 10px 3px #3aa2ff}
.sat .chip{position:absolute;left:14px;top:14px;width:46px;height:36px;border-radius:4px;background:#1a1d22;border:2px solid #555c66}
</style></head>
<body><div class="stage">

<svg class="dust" width="2048" height="768" id="dust"></svg>

<img class="cm" src="cm_left.png" alt="">

<!-- Leiterbahnen von der Kachel zum Panel -->
<svg class="traces" width="2048" height="768">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#ff8a00" stop-opacity=".2"/><stop offset=".5" stop-color="#ffb238"/><stop offset="1" stop-color="#ff8a00" stop-opacity=".5"/></linearGradient>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#2a8cff" stop-opacity=".2"/><stop offset=".6" stop-color="#5cc0ff"/><stop offset="1" stop-color="#2a8cff" stop-opacity=".3"/></linearGradient>
  </defs>
  <g fill="none" stroke-width="3" filter="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M780 520 H880 L920 480 H1180 L1220 520 H1560 L1610 470" stroke="url(#og)"/>
    <path d="M780 560 H860 L900 600 H1240 L1280 560 H1500 L1560 620" stroke="url(#og)"/>
    <path d="M780 620 H840 L880 690 H1700 L1740 650" stroke="url(#bg)"/>
    <path d="M830 480 H1100" stroke="url(#bg)" stroke-width="2"/>
  </g>
  <g fill="#ffd27a" filter="url(#g)">
    <circle cx="1610" cy="470" r="6"/><circle cx="1560" cy="620" r="6"/>
    <circle cx="1740" cy="650" r="6" fill="#7fd0ff"/>
  </g>
</svg>

<!-- Kachel mit Camper -->
<div class="tile">
  <svg viewBox="0 0 240 150" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18 112 V48 Q18 30 36 30 H160 Q172 30 180 40 L214 84 Q222 94 222 106 V112 Z" fill="rgba(255,255,255,.12)"/>
    <path d="M150 44 H172 L198 80 H150 Z" fill="#fff" stroke-width="6"/>
    <rect x="40" y="48" width="38" height="28" rx="5" fill="#fff" stroke-width="6"/>
    <rect x="94" y="48" width="38" height="28" rx="5" fill="#fff" stroke-width="6"/>
    <circle cx="64" cy="118" r="17" fill="#1f8cff"/>
    <circle cx="178" cy="118" r="17" fill="#1f8cff"/>
    <path d="M18 92 H222" stroke-width="5" opacity=".6"/>
  </svg>
</div>
<div class="refl2"></div>
<div class="floor"></div>

<!-- Titel -->
<div class="title">
  <div class="t1">Simply Open</div>
  <div class="t2">Camper</div>
  <div class="soc"><b>S.O.C.</b> · TOUCH-PANEL</div>
  <div class="sub">Zigbee · Gas · Wasser · Heizung · Victron · Satelliten</div>
</div>

<!-- Ringe unter dem Panel -->
<div class="ring" style="left:1620px;top:560px;width:390px;height:100px"></div>
<div class="ring b" style="left:1570px;top:540px;width:470px;height:140px;opacity:.6"></div>

<!-- Panel -->
<div class="panelwrap"><div class="panel"><div class="screen">
  <div class="k on"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div>
  <div class="k"><svg viewBox="0 0 24 24" fill="#9fd2ff"><path d="M12 2c-2 4-6 7-6 11a6 6 0 0 0 12 0c0-4-4-7-6-11z"/></svg><div class="bar"><i style="width:72%"></i></div></div>
  <div class="k blue"><svg viewBox="0 0 24 24" fill="#fff"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg></div>
  <div class="k"><svg viewBox="0 0 24 24" fill="#7fe08a"><path d="M16 4h-1V2H9v2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-1 15H9v-5h6v5z"/></svg></div>
  <div class="k"><svg viewBox="0 0 24 24" fill="#ffb238"><path d="M10 2h4v3h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3z"/></svg><div class="bar"><i style="width:45%;background:linear-gradient(90deg,#ff8a00,#ffc23a);box-shadow:0 0 8px #ff8a00"></i></div></div>
  <div class="k on"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div>
  <div class="k"><svg viewBox="0 0 24 24" fill="#ffd27a"><circle cx="12" cy="12" r="4.5"/><g stroke="#ffd27a" stroke-width="2"><path d="M12 1v4M12 19v4M1 12h4M19 12h4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M4.2 19.8 7 17M17 7l2.8-2.8"/></g></svg></div>
  <div class="k blue"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 12a9 9 0 0 1 18 0h-2a7 7 0 0 0-14 0zm4 0a5 5 0 0 1 10 0h-2a3 3 0 0 0-6 0zm5-1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg></div>
  <div class="k"><svg viewBox="0 0 24 24" fill="#9fd2ff"><path d="M5 3h14v18H5zM8 6v2h8V6zm0 4v2h8v-2z"/></svg></div>
  <div class="k on"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
  <div class="k"><svg viewBox="0 0 24 24" fill="#9fd2ff"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 4v5l4 2-1 1.7-5-2.7V7z"/></svg></div>
  <div class="k blue"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></div>
</div></div></div>

<!-- Satelliten -->
<div class="sat" style="left:1560px;top:625px;transform:scale(.85)"><div class="chip"></div></div>
<div class="sat" style="left:1890px;top:600px;transform:scale(.7)"><div class="chip"></div></div>

</div>
<script>
// Funken/Sternenstaub, fest gesetzt (gleiches Bild bei jedem Rendern)
let s=7,svg=document.getElementById('dust'),r=()=>(s=(s*16807)%2147483647)/2147483647,h='';
for(let i=0;i<260;i++){const x=700+r()*1348,y=r()*768,o=(.15+r()*.6).toFixed(2),c=r()<.6?'#ffb04a':'#7fc4ff',rad=(r()*1.8+.4).toFixed(1);
 h+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad}" fill="${c}" opacity="${o}"/>`}
svg.innerHTML=h;
// Spiegelung der Kachel

</script>
</body></html>

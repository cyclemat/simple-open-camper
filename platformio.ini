; Simply Open Camper (S.O.C.) – Waveshare ESP32-S3-Touch-LCD-7B (1024x600, GT911, CH32V003)
; Steuert Zigbee2MQTT-Geraete direkt per MQTT, mit Web-Editor fuer das Layout.
;
; Benoetigt pioarduino (Arduino-ESP32 3.x / ESP-IDF 5.x). Die Plattform-URL unten zeigt auf
; die jeweils stabile Version; wer reproduzierbar bauen will, ersetzt "stable" durch eine feste
; Release-Nummer von https://github.com/pioarduino/platform-espressif32/releases
;
; custom_sdkconfig loest beim ersten Build ein Neukompilieren des Arduino-Frameworks aus
; (dauert einmalig 10-20 Minuten). Noetig fuer XIP aus PSRAM – das verhindert Bildflackern,
; wenn in den Flash geschrieben wird (Layout speichern, Einstellungen, OTA).

[platformio]
; "Default" in der Statusleiste baut nur das Panel. check-all gezielt waehlen
; (Seitenleiste PlatformIO -> Project Tasks). "satellite" baut das eigene Projekt in satellite/.
default_envs = waveshare-7b

; Weitere Geraetearten am MQTT-Broker – 1 = einbauen, 0 = weglassen
[features]
; WLED-Lichtsteuerungen (in WLED: Sync -> MQTT aktivieren, Device Topic "wled/<name>")
wled = 1
; Victron Cerbo GX / Venus OS per MQTT (Solar, Netz, Ladegeraet, Batterie, DC-System).
; Am GX: Einstellungen -> Dienste -> MQTT einschalten; IP-Adresse dann in den Panel-Einstellungen eintragen
cerbo = 1
; Satelliten empfangen (eigene ESP32 mit Bluetooth-Sensoren, Projekt im Ordner satellite/): MQTT, UDP und Bluetooth
satellites = 1
; Akkus mit eigenem Bluetooth-BMS (Super B, Power Quarry, Bulltron, JBD, JK-BMS, LiTime) – src/bms.cpp.
; Zur Laufzeit zusaetzlich in den Einstellungen (Victron > Akkus mit BMS) einschalten.
bms = 1
; Hymer Connect per Bluetooth (SCU in Hymer, Buerstner, Dethleffs, Eriba, LMC ...): Licht, Batterie, Tanks, Schalter.
; 0 = weglassen (spart Flash; der RAM wird ohnehin erst belegt, wenn Hymer in den Einstellungen eingeschaltet ist)
hymer = 1
; Sprache der Panel-Oberflaeche: de, en, es, fr – weitere: python tools/i18n_update.py <kuerzel>,
; dann src/i18n/<kuerzel>.h uebersetzen (fehlende Texte bleiben deutsch)
lang = de

; Truma-Heizung – je Bedienteil eine eigene Integration
[truma]
; CP Plus ueber den LIN-Bus: 1 = einbauen. Braucht einen LIN-Transceiver (z. B. TJA1020/TJA1021)
cpplus = 0
; UART fuer den LIN-Bus (UART0 = Log/USB, daher Standard UART2)
lin_uart = 2
; GPIOs zum Transceiver: RX = dessen TX-Ausgang, TX = dessen RX-Eingang; -1 = nicht gesetzt
; 7B: UART-Stiftleiste (Schalter auf "UART" statt RS485) = GPIO15/16. Doku und Wiki widersprechen sich
; bei der Richtung – kommt nichts an, rx und tx tauschen.
lin_rx = 15
lin_tx = 16
; Treiberfreigabe (CS/SLP) des Transceivers, -1 = fest verdrahtet
lin_en = -1
; iNet X per Bluetooth: 1 = einbauen. Ein- und ausschalten dann in den Einstellungen (Bluetooth-Protokolle)
inetx = 1

; Alde-Warmwasserheizung ueber den LIN-Bus (gelbe RJ12-Buchse: LIN = Pin 4, Masse = Pin 2)
[alde]
; 1 = einbauen. Braucht einen LIN-Transceiver (TJA1020/TJA1021/MCP2025); das Panel ist dann LIN-Master
enabled = 0
; 3020 = Compact 3020, 3030 = Compact 3030, 3031 = Compact 3030 Plus (3020 HE: nur Lesen bekannt, nicht unterstuetzt)
model = 3030
; Baudrate des gelben Busses: 3030/3030 Plus 19200; beim 3020 nennen die Quellen 19200 und 9600
baud = 19200
; Pruefsumme: 0 = automatisch erkennen, 1 = klassisch (LIN 1.x), 2 = erweitert (LIN 2.x)
checksum = 0
; LIN-Anschluss: UART und GPIOs (RX = TX-Ausgang des Transceivers, TX = dessen RX-Eingang), -1 = nicht gesetzt.
; CP Plus und Alde brauchen getrennte UARTs.
lin_uart = 2
lin_rx = -1
lin_tx = -1
lin_en = -1
; Nur 3030: interner roter Bus (Glykol- und Warmwassertemperatur, nur lesen) auf eigener UART, -1 = nicht angeschlossen
red_uart = 1
red_rx = -1

; Gemeinsame Compiler-Optionen (ohne Modul-Schalter)
[base]
flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    ; NimBLE nur Fehler loggen: sonst eine Zeile pro Bluetooth-Paket (bei vielen Geraeten tausende pro Minute) –
    ; das bremst den Bluetooth-Task und damit WLAN/Webinterface, besonders wenn am USB niemand mitliest
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1

[env:waveshare-7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 4194304

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; src/sat/ gehoert zur Satelliten-Firmware (eigene Umgebung unten)
build_src_filter = +<*> -<sat/> -<vicdisp/> -<devsetup.cpp> -<p4test/> -<updater/> -<updater_link.cpp>

; upload_wait.py: vor dem Hochladen auf Enter warten (nur im Terminal; PANEL_UPLOAD_NOWAIT=1 schaltet es ab)
extra_scripts =
    pre:tools/embed_web.py
    post:tools/upload_wait.py

build_flags =
    ${base.flags}
    -DPANEL_LANG=${features.lang}
    -DWITH_WLED=${features.wled}
    -DWITH_CERBO=${features.cerbo}
    -DWITH_BMS=${features.bms}
    -DWITH_SATELLITES=${features.satellites}
    -DWITH_HYMER=${features.hymer}
    -DWITH_TRUMA_CPPLUS=${truma.cpplus}
    -DWITH_TRUMA_INETX=${truma.inetx}
    -DTRUMA_LIN_UART=${truma.lin_uart}
    -DTRUMA_LIN_RX=${truma.lin_rx}
    -DTRUMA_LIN_TX=${truma.lin_tx}
    -DTRUMA_LIN_EN=${truma.lin_en}
    -DWITH_ALDE=${alde.enabled}
    -DALDE_MODEL=${alde.model}
    -DALDE_BAUD=${alde.baud}
    -DALDE_CHECKSUM=${alde.checksum}
    -DALDE_LIN_UART=${alde.lin_uart}
    -DALDE_LIN_RX=${alde.lin_rx}
    -DALDE_LIN_TX=${alde.lin_tx}
    -DALDE_LIN_EN=${alde.lin_en}
    -DALDE_RED_UART=${alde.red_uart}
    -DALDE_RED_RX=${alde.red_rx}

; NimBLE-Arduino nutzt den NimBLE-Stack, der in Arduino-ESP32 3.3 bereits enthalten ist (Truma LevelControl)
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@^2.3.0

custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_FREERTOS_HZ=1000
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024
    CONFIG_HTTPD_MAX_URI_LEN=512
    CONFIG_MQTT_BUFFER_SIZE=4096
    CONFIG_LWIP_IP_FORWARD=y
    CONFIG_LWIP_IPV4_NAPT=y
    ; internen RAM fuer WLAN/TCP freihalten (sonst brechen neue Verbindungen mit Timeout ab)
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=49152
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=1024
    ; Internen RAM sparen (2026-11-11, WLAN + Bluetooth gleichzeitig liessen nur ~10 KB frei):
    ; Bluetooth-Host (NimBLE) legt seinen Speicher im PSRAM an
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=n
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    ; WLAN-Sendepuffer erst bei Bedarf (dann im PSRAM, SPIRAM_TRY_ALLOCATE_WIFI_LWIP) statt 8 fest reservierte intern
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_TX_BUFFER_TYPE=1
    ; feste WLAN-Empfangspuffer (intern, je 1,6 KB) 8 -> 6
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
    ; ESP-IDF verlangt: Empfangsfenster hoechstens doppelt so gross wie die festen Empfangspuffer
    CONFIG_ESP_WIFI_RX_BA_WIN=12
    ; esp_timer braucht gemessen < 0,5 KB Stack (Arduino-Vorgabe 8 KB)
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    ; Die Arduino-Vorlage enthaelt dieselben Einstellungen zusaetzlich unter alten Namen (weiter hinten) – die
    ; wuerden die neuen Werte wieder ueberschreiben, also auch dort setzen
    CONFIG_ESP32_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
    CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
    CONFIG_ESP32_WIFI_RX_BA_WIN=12
    CONFIG_TIMER_TASK_STACK_SIZE=4096

; Probebau mit ALLEN Modulen (pio run -e check-all) – nur zum Pruefen, ob alle Varianten kompilieren.
; Eigener Build-Ordner, der normale Cache von waveshare-7b bleibt unberuehrt. Nicht zum Hochladen gedacht.
[env:check-all]
extends = env:waveshare-7b
; eigene Werte statt Ueberschreiben – PlatformIO fasst doppelte -D zusammen und behaelt den ersten
build_flags =
    ${base.flags}
    -DPANEL_LANG=en
    -DWITH_WLED=1
    ; Cerbo hier aus, damit auch die leeren Ersatzfunktionen mitgeprueft werden
    -DWITH_CERBO=0
    -DWITH_SATELLITES=0
    -DWITH_HYMER=1
    -DWITH_TRUMA_CPPLUS=1 -DWITH_TRUMA_INETX=1
    -DTRUMA_LIN_UART=2 -DTRUMA_LIN_RX=15 -DTRUMA_LIN_TX=16 -DTRUMA_LIN_EN=-1
    -DWITH_ALDE=1 -DALDE_MODEL=3031 -DALDE_BAUD=19200 -DALDE_CHECKSUM=0
    -DALDE_LIN_UART=1 -DALDE_LIN_RX=6 -DALDE_LIN_TX=44 -DALDE_LIN_EN=-1
    -DALDE_RED_UART=0 -DALDE_RED_RX=43

; ------------------------------------------------------------------------------------------------
; Der Satellit (eigener ESP32) ist ein eigenes PlatformIO-Projekt im Ordner satellite/ mit eigenem
; Paketordner, damit das Umbauen des Frameworks hier (custom_sdkconfig) ihn nicht stoert.
; Die Umgebungen satellite* bauen nicht selbst: tools/run_satellite.py reicht Build/Upload/Clean an die
; gleichnamige Umgebung in satellite/ weiter (custom_sat_env). Bewusst OHNE "framework" – sonst fasst die
; Plattform das Arduino-Framework des Panels an. Das Board hier ist nur ein Platzhalter.
; Einstellungen des Satelliten (Chips, Pins, Flags, Bibliotheken) stehen in satellite/platformio.ini.
[sat_delegate]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
extra_scripts = pre:tools/run_satellite.py
monitor_speed = 115200

; ESP32 klassisch (WROOM, esp32dev)
[env:satellite]
extends = sat_delegate
custom_sat_env = esp32

; ESP32-C3 (Super Mini, DevKitM-1) – wenige Pins, Log ueber USB
[env:satellite-c3]
extends = sat_delegate
custom_sat_env = esp32-c3

; ESP32-C3 mit 0,42"-OLED (ABrobot): Sensorwert bzw. Wasserwaage auf dem OLED
[env:satellite-c3-oled]
extends = sat_delegate
custom_sat_env = esp32-c3-oled

; ESP32-S3 (DevKitC-1)
[env:satellite-s3]
extends = sat_delegate
custom_sat_env = esp32-s3

; ESP32-C6 (DevKitC-1, Super Mini) – Log ueber USB
[env:satellite-c6]
extends = sat_delegate
custom_sat_env = esp32-c6

; 16-Relais-Platine (ESP32 + 2x 74HC595), Flashen ueber USB-TTL-Adapter
[env:satellite-relay16]
extends = sat_delegate
custom_sat_env = esp32-relay16

; Satellit mit Anzeige auf dem ESP32-2432S028R ("Cheap Yellow Display", 2,8")
[env:satellite-cyd]
extends = sat_delegate
custom_sat_env = esp32-cyd

; Zusatzdisplay CYD 2,8": Kacheln vom Hauptpanel – siehe satellite/platformio.ini
[env:satellite-cyd-remote]
extends = sat_delegate
custom_sat_env = esp32-cyd-remote

; Mini-Display "nur Victron" (Cerbo GX + Victron-Bluetooth), eigene schlanke Firmware – siehe satellite/platformio.ini
[env:satellite-cyd-victron]
extends = sat_delegate
custom_sat_env = esp32-cyd-victron

; Kleiner Updater fuer ESP32-Geraete (Satellit, CYD, Victron-Display, Relais): einmal per USB nach app1
[env:satellite-updater]
extends = sat_delegate
custom_sat_env = esp32-updater

; ------------------------------------------------------------------------------------------------
; Display-Tests (Flackern/Bildfehler beim 7B): eigenes Projekt in display-testing/ mit eigenem Paketordner,
; weil die Tests custom_sdkconfig aendern (sonst wuerde jeder Wechsel das Framework neu bauen).
; Stellschrauben und Testprotokoll stehen in display-testing/platformio.ini.
[env:waveshare-7b-display-testing]
extends = sat_delegate
board = esp32-s3-devkitc-1
custom_sub_dir = display-testing
custom_sat_env = waveshare-7b-display-testing

; ------------------------------------------------------------------------------------------------
; Naechstes Panel: ELECROW CrowPanel Advanced 7" (ESP32-P4 + C6). Eigenes Projekt in p4/ mit eigenem Paketordner.
; Eine Firmware fuer alle P4-Boards (Tabelle src/board_p4_boards.cpp); Board beim ersten Start: p4/platformio.ini [p4] board.
[env:crowpanel-p4]
extends = sat_delegate
board = esp32-p4
custom_sub_dir = p4
custom_sat_env = crowpanel-p4

; Hardware-Test fuer das P4-Board (Testbild, Touch, WLAN ueber den C6) - src/p4test/
[env:crowpanel-p4-test]
extends = sat_delegate
board = esp32-p4
custom_sub_dir = p4
custom_sat_env = crowpanel-p4-test

; ELECROW CrowPanel 1.46" HMI ESP32 Rotary Display (DHR55146D, ESP32-S3, rund 360x360, Drehknopf): volle Panel-Firmware,
; Einrichtung ueber die Weboberflaeche. Eigenes Projekt in crowpanel146/ (ohne Framework-Neubau).
[env:crowpanel-146]
extends = sat_delegate
board = esp32-s3-devkitc-1
custom_sub_dir = crowpanel146
custom_sat_env = crowpanel-146

; Rundes Zusatzdisplay (Kacheln vom Hauptpanel) auf dem CrowPanel 1.46" – siehe crowpanel146/platformio.ini
[env:crowpanel-146-remote]
extends = sat_delegate
board = esp32-s3-devkitc-1
custom_sub_dir = crowpanel146
custom_sat_env = crowpanel-146-remote

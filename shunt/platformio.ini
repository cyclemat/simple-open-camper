; Simple Open Camper – SmartShunt (Satellit mit INA228 + externem Shunt) auf dem ESP32-C3 Super Mini.
; Eigenes Projekt (Quellen aus ../src wie die Satelliten), Pakete aus satellite/ (nichts doppelt entpacken).
; Baut die Satelliten-Firmware mit SmartShunt (-DSAT_SHUNT=1), OHNE Bluetooth-Sensoren (-DSAT_BLE_SENS=0:
; kein Truma/Mopeka/Victron/Hymer – Bluetooth nur zum Einrichten per Knopf). GPIO-Anschluesse und die Zusatzsensoren
; (Karte "Weitere Sensoren") bleiben. Spezifikation und Anschluss: docs/smartshunt.md
;
; Bauen/Flashen:  pio run -d shunt -e shunt-c3 -t upload   (im Panel-Menue: Umgebung "shunt-c3")
; Erste Einrichtung wie jeder Satellit: WLAN "SOC-Satellite-…" (Passwort panelsat) bzw. per Knopf vom Panel.
[platformio]
src_dir = ../src
include_dir = ../include
packages_dir = ../satellite/.pio/packages
default_envs = shunt-c3

; welche Zusatzsensoren mitgebaut werden (wie satellite/platformio.ini [sensors])
[sensors]
bme280 = 1
sht = 1
aht20 = 1
scd4x = 0
ina = 1
dht22 = 1
hx711 = 0
ultrasonic = 0
flow = 0
float = 0

[env:shunt-c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = post:../tools/upload_wait.py
build_src_filter = -<*> +<sat/> +<devsetup.cpp> +<dbglog.cpp> +<sat_proto.cpp> +<truma.cpp> +<mopeka.cpp> +<victron.cpp> +<cerbo.cpp>
    +<truma_inetx.cpp> +<hymer.cpp> +<hymer_tls.cpp> +<i18n/i18n.cpp> +<updater_link.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DPANEL_SATELLITE=1
    -DPANEL_LANG=de
    -DWITH_TRUMA_INETX=0
    -DWITH_CERBO=0
    -DWITH_HYMER=0
    -DBLE_DEVICE_NAME='"PanelSat"'
    -DSAT_SHUNT=1
    -DSAT_BLE_SENS=0
    -DSENS_BME280=${sensors.bme280}
    -DSENS_SHT=${sensors.sht}
    -DSENS_AHT20=${sensors.aht20}
    -DSENS_SCD4X=${sensors.scd4x}
    -DSENS_INA=${sensors.ina}
    -DSENS_DHT22=${sensors.dht22}
    -DSENS_HX711=${sensors.hx711}
    -DSENS_US=${sensors.ultrasonic}
    -DSENS_FLOW=${sensors.flow}
    -DSENS_FLOAT=${sensors.float}
    ; USB-Buchse des Super Mini als serielle Konsole
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.2

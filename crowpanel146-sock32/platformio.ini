; Variante "32 Sockets" (Test, seit 2026-11-24) fuer das ELECROW CrowPanel 1.46" Rotary: volle Panel-Firmware wie
; crowpanel146/platformio.ini (Umgebung crowpanel-146), aber mit 32 statt 16 Netzwerk-Sockets (Webserver, Broker,
; Tailscale, UDP … teilen sich den Vorrat). Macht es Probleme, gehen wir wieder auf 16 zurueck.
; custom_sdkconfig -> pioarduino uebersetzt die Arduino-Bibliotheken mit ESP-IDF neu ("Hybrid Compile", ~1-2 h beim
; ersten Mal), daher EIGENER Paketordner (der gemeinsame der Satelliten/normalen Panels bleibt unberuehrt).
; Aus PowerShell bauen (nicht Git-Bash):  pio run -d crowpanel146-sock32   bzw. im Panel-Menue "crowpanel-146-sock32".
; WICHTIG: build_flags/lib_deps von Hand mit crowpanel146/platformio.ini gleich halten.
; Der ESP32-S3 hat WLAN im Chip (kein esp_hosted wie beim P4) – Versionen festlegen ist hier nicht noetig.

[platformio]
src_dir = ../src
include_dir = ../include
; EIGENER Paketordner: custom_sdkconfig baut das Framework darin um
packages_dir = .pio/packages
default_envs = crowpanel-146-sock32

[env:crowpanel-146-sock32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = ../partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 4194304
; mehr Netzwerk-Sockets (fertige Bibliotheken: 16 fuer alles – Webserver, Broker, Tailscale, UDP …)
custom_sdkconfig =
    CONFIG_LWIP_MAX_SOCKETS=32
    CONFIG_LWIP_MAX_ACTIVE_TCP=32
    ; Internen RAM sparen (2026-11-24): Bluetooth-Host (NimBLE) legt seine Pools im PSRAM an (wie beim Waveshare);
    ; lwIP liegt in den fertigen S3-Bibliotheken schon im PSRAM (SPIRAM_TRY_ALLOCATE_WIFI_LWIP).
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=n
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    ; Host-Task wertet jedes Werbepaket aus (alle Module, Ruuvi/BTHome entschluesseln) – 5 KB waren eng
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
    ; 5 statt 3 Bluetooth-Verbindungen (Controller im Chip erlaubt 6): Super B + Votronic + Hobby dauerhaft, dazu
    ; Truma messen / Shelly / Orion kurz – beim P4 nicht aenderbar (Controller sitzt im C6)
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=5
    ; BLE-Mesh (S3-Vorlage: an) wird nicht gebraucht; im Hybrid-Build scheiterte lib/ext.c (falsche crypto.h, 2026-11-25)
    CONFIG_BLE_MESH=n
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_src_filter = +<*> -<sat/> -<vicdisp/> -<devsetup.cpp> -<p4test/> -<updater/> -<updater_link.cpp>
extra_scripts =
    pre:../tools/embed_web.py
    post:../tools/upload_wait.py

; Sprache der Panel-Oberflaeche (de | en | es | fr) – Varianten unten setzen nur diese Option anders
custom_lang = de
build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-Anschluss des ESP32-S3 direkt (kein USB-UART-Chip): Log und Hochladen darueber
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DBOARD_CROWPANEL146=1
    -DPANEL_LANG=${this.custom_lang}
    -DWITH_WLED=1
    -DWITH_CERBO=1
    -DWITH_BMS=1
    -DWITH_SATELLITES=1
    -DWITH_HYMER=1
    -DWITH_TRUMA_CPPLUS=0
    -DWITH_TRUMA_INETX=1
    -DTRUMA_LIN_UART=2
    -DTRUMA_LIN_RX=-1
    -DTRUMA_LIN_TX=-1
    -DTRUMA_LIN_EN=-1
    -DWITH_ALDE=0
    -DALDE_MODEL=3030
    -DALDE_BAUD=19200
    -DALDE_CHECKSUM=0
    -DALDE_LIN_UART=2
    -DALDE_LIN_RX=-1
    -DALDE_LIN_TX=-1
    -DALDE_LIN_EN=-1
    -DALDE_RED_UART=1
    -DALDE_RED_RX=-1
    ; Tailscale (Beta): Panel im Tailnet, Editor von unterwegs – src/tailscale.*, src/third_party/microlink (MIT).
    ; Ab Werk aus, einschalten im Editor unter Einstellungen > Netzwerk
    ; Shelly Gen2+ per Bluetooth (Beta, ab Werk aus) – src/shelly_ble.*
    -DWITH_SHELLY_BLE=1
    ; Eigene Kachel-Symbole (PNG aus dem Flash per Editor-Upload und von der SD-Karte) – src/user_icons.*
    -DWITH_USER_ICONS=1
    ; Regel-Engine (Blockly-Editor im Browser) und eingebauter MQTT-Broker (ab Werk aus, Editor > MQTT) wie beim P4
    -DWITH_RULES=1
    -DWITH_BROKER=1
    ; Geraete aus MQTT-Discovery (ESPHome, Tasmota …) wie Satelliten – src/mqtt_disco.*, ab Werk aus
    -DWITH_MQTT_DISCO=1
    ; Home Assistant ueber die Integration simple-open-camper-HA-Integration (WebSocket /api/ha), ab Werk aus
    -DWITH_HA_LINK=1
    -DWITH_TAILSCALE=1
    ; Zigbee-Funkmodul (ESP32-H2) an der UART-Buchse hinten (J34: 1 RX = GPIO44, 2 TX = GPIO43, 3 = 5 V, 4 = GND).
    ; ACHTUNG: Buchse hat 5-V-Pegel und 5 V Versorgung -> Pegelwandler 5 V/3,3 V + 3,3-V-Regler zum Modul (README).
    ; UART2 (UART1 ist die Vorgabe fuer Hobby/CI-BUS); ab Werk aus, einschalten im Editor unter Einstellungen > Zigbee
    -DWITH_ZB_DIRECT=1
    -DZBD_UART=UART_NUM_2
    -DZBD_TX=43
    -DZBD_RX=44
    -DZBD_DEFAULT_ON=0
; Include-Pfade von Tailscale/microlink NUR fuer unsere Quellen (build_src_flags): in build_flags wuerden sie beim
; Hybrid-Build (custom_sdkconfig) auch die ESP-IDF-Bausteine treffen – wireguard_lwip/src/crypto.h ueberdeckt dann die
; crypto.h von wpa_supplicant und BLE-Mesh ("implicit declaration crypto_bignum_…", 2026-11-25).
build_src_flags =
    -I../src/third_party/microlink/include
    -I../src/third_party/microlink/wireguard_lwip/src
    -I../src/third_party/microlink/wireguard_lwip/src/crypto/refc

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.2
    ; 1.3.0 (1.2.7 wie bei Elecrow laesst sich mit IDF 5.5 nicht uebersetzen; Startbefehle: board_crowpanel146.cpp)
    lovyan03/LovyanGFX@1.3.0

; Sprachvarianten (wie in crowpanel146/platformio.ini): nur die Oberflaechensprache anders
[env:crowpanel-146-sock32-es]
extends = env:crowpanel-146-sock32
custom_lang = es

[env:crowpanel-146-sock32-fr]
extends = env:crowpanel-146-sock32
custom_lang = fr

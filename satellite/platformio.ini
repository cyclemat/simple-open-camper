; Simply Open Camper (S.O.C.) – Satellit: eigener ESP32, liest Truma LevelControl, Mopeka und Victron per
; Bluetooth, dazu Sensoren/Schalter an den GPIOs, und schickt die Werte per MQTT (mit Home-Assistant-Discovery),
; UDP und/oder Bluetooth ans Panel.
; Einrichten: WLAN "SOC-Satellite-<id>" (Passwort panelsat), dann http://192.168.4.1/
;
; Eigenes PlatformIO-Projekt, damit es sich nicht mit dem Panel in die Quere kommt: Das Panel baut wegen
; custom_sdkconfig das Arduino-Framework um. Mit gemeinsamem Paketordner loeste jeder Wechsel
; Panel <-> Satellit "Reinstall Arduino framework" aus (Panel danach ~1 h Neubau). Deshalb hat der
; Satellit unten einen eigenen packages_dir. Der Quellcode bleibt gemeinsam in ../src.
;
; Je Chip eine Umgebung. Bauen/Hochladen:
;   im PlatformIO-Menue des Panels: satellite, satellite-c3, satellite-s3, satellite-c6, satellite-relay16,
;                                   satellite-cyd, satellite-cyd-victron
;   oder im Hauptordner:            pio run -d satellite -e esp32-c3 -t upload
; Die Pinliste im Web-IF passt sich dem Chip an (src/sat/sat_io.cpp, PINS).

[platformio]
src_dir = ../src
include_dir = ../include
; eigener Paketordner (Framework, Toolchain), liegt im Build-Ordner und ist damit nicht im Git
packages_dir = .pio/packages
default_envs = esp32

; Gemeinsame Einstellungen aller Satelliten
[sat]
; Hymer Connect per Bluetooth (SCU im Fahrzeug): 1 = einbauen, 0 = weglassen (spart Flash, beim C6 wird es knapp)
hymer = 1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; 1,9 MB pro App mit Platz fuer Updates ueber die Weboberflaeche (braucht 4 MB Flash)
board_build.partitions = min_spiffs.csv
; 4 MB fest, damit dieselbe Firmware auch auf Boards mit mehr Flash startet
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = post:../tools/upload_wait.py
; Nutzt dieselben Module wie das Panel (truma.cpp, mopeka.cpp, victron.cpp)
build_src_filter = -<*> +<sat/> +<devsetup.cpp> +<sat_proto.cpp> +<truma.cpp> +<mopeka.cpp> +<victron.cpp> +<cerbo.cpp>
    +<truma_inetx.cpp> +<hymer.cpp> +<hymer_tls.cpp> +<i18n/i18n.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DPANEL_SATELLITE=1
    -DPANEL_LANG=de
    -DWITH_TRUMA_INETX=0
    -DWITH_CERBO=0
    -DWITH_HYMER=${sat.hymer}
    -DBLE_DEVICE_NAME='"PanelSat"'
; Log ueber die eingebaute USB-Schnittstelle (Boards ohne USB-Seriell-Wandler, z. B. Super Mini)
usb_cdc_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@^2.3.0

; ESP32 klassisch (WROOM, esp32dev) – die meisten Pins, Analog an GPIO 32–39
[env:esp32]
extends = sat
board = esp32dev

; ESP32-C3 (Super Mini, DevKitM-1) – 13 freie Pins, Analog an GPIO 0–4, I2C an 8/9
[env:esp32-c3]
extends = sat
board = esp32-c3-devkitm-1
; Super-Mini-Boards starten nur im DIO-Modus zuverlaessig
board_build.flash_mode = dio
build_flags = ${sat.build_flags} ${sat.usb_cdc_flags}

; ESP32-2432S028R ("Cheap Yellow Display"): klassischer ESP32 ohne PSRAM, 2,8" 320x240 (ILI9341) mit
; resistivem Touch (XPT2046). Satellit mit eigener Anzeige im Stil des Panels (src/sat/sat_display.cpp, LVGL).
; Display, Touch, SD und RGB-LED belegen fast alle Pins – frei bleiben GPIO 22, 27 (Stecker CN1/P3) und 35 (nur Eingang).
; Ohne Hymer (spart Flash fuer LVGL und die Schriften).
[env:esp32-cyd]
extends = sat
board = esp32dev
build_src_filter = ${sat.build_src_filter} +<fonts/font_ui_16.c> +<fonts/font_ui_20.c> +<fonts/font_icons_24.c>
    +<lv_psram_alloc.c>
build_flags =
    ; nur Warnungen und Fehler loggen (spart Flash fuer LVGL)
    -DCORE_DEBUG_LEVEL=2
    -DPANEL_SATELLITE=1
    -DPANEL_LANG=de
    -DWITH_TRUMA_INETX=0
    -DWITH_CERBO=0
    -DWITH_HYMER=0
    -DBLE_DEVICE_NAME='"PanelSat"'
    -DSAT_DISPLAY=1
    -DSAT_BOARD_CYD=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
lib_deps =
    ${sat.lib_deps}
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@^1.1.16

; Victron-Display auf dem Mini-Display (ESP32-2432S028R): eigene, schlanke Firmware (src/vicdisp/). Holt alle Werte
; vom Cerbo GX (MQTT im LAN, optional) und liest Victron-Geraete sowie Truma LevelControl direkt per Bluetooth.
; Keine Satelliten-Funktionen (kein Mopeka/Hymer/iNet X, keine GPIO-Sensoren, kein Senden ans Panel).
; truma.cpp/mopeka.cpp/truma_inetx.cpp/hymer*.cpp werden mitgebaut (Bluetooth-Verteiler), die Zusatzprotokolle
; sind per WITH_*=0 bzw. ble_proto_on() (src/vicdisp/vd_ble.cpp) abgeschaltet.
; Einrichten: WLAN "SOC-Victron-<id>" (Passwort panelsat), dann http://192.168.4.1/
[env:esp32-cyd-victron]
extends = sat
board = esp32dev
; Startbild: assets/splash_cyd.jpg (320x240, baseline), eigenes Bild als splash_cyd.jpg in den Projektordner legen
extra_scripts = pre:../tools/embed_splash_cyd.py
    post:../tools/upload_wait.py
build_src_filter = -<*> +<vicdisp/> +<sat/sat_display.cpp> +<cerbo.cpp> +<victron.cpp> +<i18n/i18n.cpp> +<devsetup.cpp> +<gx_find.cpp>
    +<truma.cpp> +<mopeka.cpp> +<truma_inetx.cpp> +<hymer.cpp> +<hymer_tls.cpp>
    +<fonts/font_ui_16.c> +<fonts/font_ui_20.c> +<fonts/font_icons_24.c> +<lv_psram_alloc.c>
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DPANEL_SATELLITE=1
    -DPANEL_LANG=de
    -DWITH_CERBO=1
    -DWITH_HYMER=0
    -DWITH_TRUMA_INETX=0
    -DSAT_DISPLAY=1
    -DSAT_BOARD_CYD=1
    -DSAT_VICTRON_ONLY=1
    -DSAT_SPLASH=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I../include
lib_deps =
    ${sat.lib_deps}
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@^1.1.16

; ESP32-S3 (DevKitC-1) – Analog an GPIO 1–10, I2C an 8/9. Log ueber die Buchse "UART"
[env:esp32-s3]
extends = sat
board = esp32-s3-devkitc-1

; ESP32-C6 (DevKitC-1, Super Mini) – Analog an GPIO 0–6, Log ueber USB
[env:esp32-c6]
extends = sat
board = esp32-c6-devkitc-1
; DIO wie beim C3 – laeuft auch auf Super-Mini-Boards
board_build.flash_mode = dio
build_flags = ${sat.build_flags} ${sat.usb_cdc_flags}

; 16-Relais-Platine mit ESP32-WROOM-32E und zwei 74HC595 (LCTech "ESP32 Relay X16" und Nachbauten).
; Relais 1–16 ueber das Schieberegister (Daten GPIO14, Takt GPIO13, Latch GPIO12, OE GPIO5); beim ersten Start
; sind alle 16 als Schalter angelegt. Kein USB-Chip: Flashen ueber einen 3,3-V-USB-TTL-Adapter an der
; Programmierleiste (3V3, TX, RX, GND, IO0), dabei IO0 gedrueckt halten und kurz EN/Reset.
[env:esp32-relay16]
extends = sat
board = esp32dev
build_flags = ${sat.build_flags}
    -DSAT_IO_SWITCHES=16
    -DSAT_SR595_BITS=16
    -DSAT_SR595_DATA=14
    -DSAT_SR595_CLK=13
    -DSAT_SR595_LATCH=12
    -DSAT_SR595_OE=5


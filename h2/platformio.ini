; Simple Open Camper – Zigbee-Funkmodul ESP32-H2 (Elecrow-Modul im Steckplatz des CrowPanel Advanced P4)
;
; Eigenes PlatformIO-Projekt (anderer Chip), Quellcode src/zb_h2/ (Protokoll zum Panel: src/zb_link.h).
; Bauen/Hochladen: im PlatformIO-Menue des Panels "zigbee-h2" oder hier: pio run -d h2 -t upload
; Hochladen ueber die USB-C-Buchse des Moduls (eigene USB-Schnittstelle des H2, z. B. COM25).
; Klemmt das Hochladen: BOOT halten, RST druecken, BOOT loslassen.

[platformio]
src_dir = ../src
include_dir = ../include
; gemeinsamer Paketordner mit satellite/ (enthaelt die RISC-V-Werkzeuge und die Zigbee-Bibliotheken fuer den H2)
packages_dir = ../satellite/.pio/packages
default_envs = zigbee-h2

[env:zigbee-h2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
; Zigbee-Koordinator: Partitionen zb_storage/zb_fct fuer das Netz (aus dem Arduino-Framework)
board_build.partitions = zigbee_zczr.csv
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<zb_h2/>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Koordinator/Router-Variante des Zigbee-Stacks linken
    -DZIGBEE_MODE_ZCZR
    ; USB-Buchse des Moduls als serielle Konsole (Test/Log), UART frei fuer das Panel
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; UART-Pins des Moduls zum Panel (Datenblatt nennt nur "U1TXD/U1RXD" – vermutlich GPIO 24/23)
    -DZB_H2_TX=24
    -DZB_H2_RX=23
lib_deps =
    bblanchon/ArduinoJson@7.4.2
